<!DOCTYPE html>
<!--
AI Model: Claude Opus 5.5 (claude-opus-5-5)
User Prompt: imagine/ に新しいアプリを作ってください。imagine/images にある３枚の写真から連想する楽しいアプリを自由に考えて、自由に作ってください。あなたの創造性を最大限発揮してください。
  写真1: 満月 / 写真2: にぎり寿司（マグロ・サバ・ブリ・イクラ）/ 写真3: 木とレジンのハロウィン・キーホルダー（コウモリ、魔女帽子のかぼちゃ）
AI Approach:
  3枚を「満月の夜に、キーホルダー姿のおばけたちが通う回転寿司屋」という1つの世界にまとめた。
  - HTML5 Canvas（論理解像度 720x1200 を画面に合わせて拡大縮小）と requestAnimationFrame のゲームループ
  - おばけ客は写真3のキーホルダーを再現した「木枠＋青レジン」スタイルを Path2D で描画
    （塗り → 濃い茶の太線 → 木色の細線 の重ね描きでレーザーカットの縁を表現）
  - 寿司は写真2のネタ（マグロ・サバ・ブリ・イクラ軍艦）＋タマゴを Canvas で描画、ボタンは写真2の黒い石皿と笹の葉風
  - 満月は写真1（images/00_P9292277.png）を 'lighter' 合成で夜空に重ねる。読み込めない場合は手続き的に描いた月で代用
  - 月は営業時間の時計を兼ねて空を横切る。雲から出ている間は「月光ボーナス」
  - Web Audio API で和音階（都節）の琴と太鼓のBGM、効果音をすべてその場で合成
  - ハイスコアは localStorage に保存
Implementation Intent:
  写真から連想を広げて作る遊び。ネタを流すタイミングと順番を考える、短く遊べる回転寿司ゲーム。
  最後に「今夜の記念キーホルダー」がもらえて、写真3につながる。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>満月おばけ寿司</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 80px rgba(120,140,255,.12)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
// ============================================================
//  基本設定
// ============================================================
const W = 720, H = 1200;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let SCALE = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SCALE = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * SCALE + 'px';
  cv.style.height = H * SCALE + 'px';
  cv.width = Math.round(W * SCALE * DPR);
  cv.height = Math.round(H * SCALE * DPR);
}
addEventListener('resize', resize);
resize();

const SERIF = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif';
const SANS = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';

const WOOD = '#d4a96a', WOOD_D = '#5e4020', WOOD_L = '#e8c890';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c = 1.7; t -= 1; return 1 + t * t * ((c + 1) * t + c); };
const TAU = Math.PI * 2;

// 決定的な乱数（背景などを毎フレーム同じに描くため）
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ============================================================
//  レイアウト
// ============================================================
const SEAT_X = [120, 280, 440, 600];
const CUST_Y = 712;        // お客さんの中心
const COUNTER_Y = 782;     // カウンター天板
const BELT_Y = 818;        // レーン上端
const BELT_H = 92;
const PLATE_Y = 872;       // 皿の中心
const DROP_X = 50;         // 板前が皿を置く位置
const KITCHEN_Y = 912;

const NETA = [
  { id: 'maguro', name: 'マグロ', price: 120 },
  { id: 'saba',   name: 'サバ',   price: 100 },
  { id: 'buri',   name: 'ブリ',   price: 110 },
  { id: 'ikura',  name: 'イクラ', price: 150 },
  { id: 'tamago', name: 'タマゴ', price: 80 },
];
const NETA_BY_ID = Object.fromEntries(NETA.map(n => [n.id, n]));
const BTN = NETA.map((n, i) => ({ x: 24 + i * 136, y: 936, w: 128, h: 150 }));
const TEA_BTN = { x: 250, y: 1106, w: 220, h: 72 };
const MUTE_BTN = { x: 662, y: 10, w: 48, h: 44 };
const START_BTN = { x: 200, y: 990, w: 320, h: 92 };
const RETRY_BTN = { x: 100, y: 1052, w: 250, h: 82 };
const TITLE_BTN = { x: 370, y: 1052, w: 250, h: 82 };

const CUST_INFO = {
  bat:     { name: 'コウモリ',     pat: 0.85, pay: 1.0 },
  pumpkin: { name: 'かぼちゃ魔女', pat: 1.0,  pay: 1.0 },
  ghost:   { name: 'おばけ',       pat: 1.15, pay: 1.1 },
  wolf:    { name: '狼男',         pat: 1.35, pay: 1.3 },
};

// ============================================================
//  サウンド（Web Audio API で全部合成）
// ============================================================
let actx = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem('obakeSushiMute') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = muted ? 0 : 0.55;
  master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function setMuted(m) {
  muted = m;
  try { localStorage.setItem('obakeSushiMute', m ? '1' : '0'); } catch (e) {}
  if (master) master.gain.setTargetAtTime(m ? 0 : 0.55, actx.currentTime, 0.05);
}
function tone(freq, dur, { type = 'sine', vol = 0.2, when = 0, slide = null, attack = 0.005 } = {}) {
  if (!actx) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, { vol = 0.2, when = 0, freq = 1200, q = 1, type = 'bandpass', slide = null } = {}) {
  if (!actx) return;
  const t = actx.currentTime + when;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  place()   { tone(620, 0.08, { type: 'triangle', vol: 0.22 }); tone(930, 0.1, { type: 'triangle', vol: 0.15, when: 0.04 }); },
  block()   { tone(180, 0.12, { type: 'square', vol: 0.08 }); },
  arrive()  { tone(520, 0.12, { vol: 0.18 }); tone(780, 0.16, { vol: 0.14, when: 0.07 }); },
  grab()    { noise(0.06, { vol: 0.25, freq: 900 }); noise(0.06, { vol: 0.25, freq: 700, when: 0.12 }); noise(0.06, { vol: 0.22, freq: 800, when: 0.24 }); },
  coin()    { tone(1318, 0.09, { type: 'square', vol: 0.07 }); tone(1975, 0.22, { type: 'square', vol: 0.06, when: 0.07 }); },
  angry()   { tone(170, 0.45, { type: 'sawtooth', vol: 0.13, slide: 80 }); },
  squeak()  { tone(2400, 0.07, { vol: 0.08, slide: 3400 }); tone(2600, 0.07, { vol: 0.07, slide: 3600, when: 0.1 }); },
  shoo()    { noise(0.3, { vol: 0.3, freq: 400, slide: 3000, q: 2 }); tone(900, 0.2, { vol: 0.1, slide: 300 }); },
  steal()   { tone(700, 0.3, { type: 'triangle', vol: 0.15, slide: 1400 }); },
  discard() { tone(120, 0.25, { type: 'triangle', vol: 0.2, slide: 60 }); },
  spell()   { [0, 4, 7, 12, 16].forEach((s, i) => tone(660 * Math.pow(2, s / 12), 0.18, { type: 'triangle', vol: 0.08, when: i * 0.05 })); },
  tea()     { [0, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.6, { vol: 0.1, when: i * 0.08 })); },
  moon()    { [0, 5, 7, 12].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.9, { vol: 0.05, when: i * 0.09 })); },
  lantern() { tone(300, 0.6, { type: 'sine', vol: 0.15, slide: 120 }); noise(0.4, { vol: 0.1, freq: 600, type: 'lowpass' }); },
  start()   { [0, 3, 5, 7, 10, 12].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.25, { type: 'triangle', vol: 0.12, when: i * 0.07 })); },
  end()     { [12, 10, 7, 5, 3, 0].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.35, { type: 'triangle', vol: 0.12, when: i * 0.12 })); },
};
function sfx(name) { if (actx && !muted) SFX[name](); }

// BGM：都節音階（E F A B C）の琴と太鼓
const BGM = { id: null, next: 0, step: 0 };
const IN = [0, 1, 5, 7, 8];
const _ = null;
const MEL = [5, _, 4, _, 3, _, 4, 5,  6, _, 5, _, 3, _, _, _,  2, _, 3, _, 4, _, 3, 2,  1, _, 0, _, _, _, _, _,
             5, _, 6, _, 7, _, 6, 5,  4, _, 3, _, 4, _, 5, _,  3, _, 2, _, 1, _, 2, 3,  0, _, _, _, _, _, _, _];
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const degMidi = d => 64 + IN[((d % 5) + 5) % 5] + 12 * Math.floor(d / 5);
function pluck(freq, t, vol) {
  const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'triangle'; o2.type = 'sawtooth';
  o.frequency.value = freq; o2.frequency.value = freq * 1.003;
  f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(600, t + 0.5);
  const g2 = actx.createGain(); g2.gain.value = 0.25;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + 1); o2.stop(t + 1);
}
function taiko(t, vol, rim) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(rim ? 320 : 120, t);
  o.frequency.exponentialRampToValueAtTime(rim ? 200 : 48, t + 0.25);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (rim ? 0.08 : 0.4));
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.5);
}
function bgmTick() {
  if (!actx) return;
  const stepDur = 0.21;
  while (BGM.next < actx.currentTime + 0.3) {
    const s = BGM.step % MEL.length, t = BGM.next;
    const d = MEL[s];
    if (d !== null) pluck(midi(degMidi(d)), t, 0.07);
    if (s % 16 === 0) pluck(midi(degMidi(s % 32 === 0 ? -5 : -3)), t, 0.06);
    if (s % 8 === 0) taiko(t, 0.32);
    if (s % 8 === 6) taiko(t, 0.08, true);
    if (s % 16 === 12) taiko(t, 0.18);
    BGM.next += stepDur; BGM.step++;
  }
}
function startBGM() { if (!actx) return; stopBGM(); BGM.next = actx.currentTime + 0.15; BGM.step = 0; BGM.id = setInterval(bgmTick, 60); }
function stopBGM() { if (BGM.id) clearInterval(BGM.id); BGM.id = null; }

// ============================================================
//  満月の写真（読み込めなければ手続き的な月で代用）
// ============================================================
const moonImg = new Image();
let moonLoaded = false;
moonImg.onload = () => { moonLoaded = true; };
moonImg.src = 'images/00_P9292277.png';
// 写真内の月の位置と半径（1200x1200 の画像）
const MOON_PHOTO = { cx: 612, cy: 592, r: 382, size: 1200 };

// ============================================================
//  背景の素材を前計算
// ============================================================
const rng = mulberry(20261031);
const STARS = Array.from({ length: 140 }, () => ({ x: rng() * W, y: rng() * 560, r: rng() * 1.6 + 0.3, ph: rng() * TAU, sp: rng() * 2 + 0.5 }));
const TOWN = (() => {
  const b = []; let x = -10;
  while (x < W + 10) {
    const w = 40 + rng() * 60, h = 30 + rng() * 60;
    b.push({ x, w, h, roof: rng() < 0.7, win: Array.from({ length: Math.floor(rng() * 3) }, () => ({ x: rng() * (w - 14) + 4, y: rng() * (h - 20) + 8, ph: rng() * TAU })) });
    x += w - 4;
  }
  return b;
})();
const MARIA = Array.from({ length: 14 }, () => ({ a: rng() * TAU, d: rng() * 0.6, r: 0.12 + rng() * 0.22 }));

// ============================================================
//  描画ヘルパ（キーホルダー風：木枠＋レジン）
// ============================================================
function laser(p, lw) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = WOOD_D; ctx.lineWidth = lw + 3; ctx.stroke(p);
  ctx.strokeStyle = WOOD; ctx.lineWidth = lw; ctx.stroke(p);
}
function gloss(p, x, y, w, h) {
  ctx.save(); ctx.clip(p);
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, 'rgba(255,255,255,0.0)');
  g.addColorStop(0.42, 'rgba(255,255,255,0.0)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.28)');
  g.addColorStop(0.58, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.restore();
}
function bubbles(pts) { // レジンの気泡
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const [x, y, r] of pts) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
}
function blueResin(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#7f93d8'); g.addColorStop(0.5, '#4458a8'); g.addColorStop(1, '#2c3a7c');
  return g;
}

// ---------- コウモリ ----------
function drawBat(x, y, s, o = {}) {
  const t = o.t || 0, mood = o.mood || 'normal';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.rot) ctx.rotate(o.rot);
  const flap = Math.sin(t * (o.flapSpeed || 3)) * (o.flapAmp ?? 0.18);
  for (const side of [-1, 1]) {
    ctx.save(); ctx.scale(side, 1);
    ctx.translate(22, -4); ctx.rotate(-flap); ctx.translate(-22, 4);
    const p = new Path2D();
    p.moveTo(22, -14); p.quadraticCurveTo(60, -34, 106, -44);
    p.quadraticCurveTo(100, -20, 104, 4);
    p.quadraticCurveTo(88, -6, 80, 14);
    p.quadraticCurveTo(66, 2, 56, 22);
    p.quadraticCurveTo(42, 10, 24, 18);
    p.closePath();
    if (o.thief) {
      const g = ctx.createLinearGradient(0, -44, 0, 22);
      g.addColorStop(0, '#b06ac0'); g.addColorStop(1, '#5a2270');
      ctx.fillStyle = g;
    } else ctx.fillStyle = blueResin(-44, 22);
    ctx.fill(p);
    gloss(p, 20, -50, 90, 80);
    bubbles([[70, -18, 1.6], [86, -26, 1.1], [46, 2, 1.3]]);
    laser(p, 4.5);
    const r = new Path2D();
    r.moveTo(28, -4); r.lineTo(102, -36);
    r.moveTo(28, 0); r.lineTo(80, 12);
    r.moveTo(26, 4); r.lineTo(56, 20);
    laser(r, 3.5);
    ctx.restore();
  }
  // 頭
  const h = new Path2D();
  h.moveTo(-30, -20); h.lineTo(-28, -50); h.quadraticCurveTo(-20, -54, -12, -34);
  h.quadraticCurveTo(0, -38, 12, -34); h.quadraticCurveTo(20, -54, 28, -50); h.lineTo(30, -20);
  h.quadraticCurveTo(36, 24, 0, 32); h.quadraticCurveTo(-36, 24, -30, -20); h.closePath();
  const hg = ctx.createLinearGradient(0, -50, 0, 32);
  hg.addColorStop(0, WOOD_L); hg.addColorStop(1, WOOD);
  ctx.fillStyle = mood === 'angry' ? '#d98a6a' : hg; ctx.fill(h);
  ctx.strokeStyle = WOOD_D; ctx.lineWidth = 2.5; ctx.stroke(h);
  // キーリングの穴
  ctx.fillStyle = WOOD_D; ctx.beginPath(); ctx.arc(0, -28, 3.5, 0, TAU); ctx.fill();
  drawFaceEyes(-12, -8, 12, -8, 8, mood, o.thief ? '#c03030' : '#8a5530');
  // 口と牙
  ctx.strokeStyle = WOOD_D; ctx.lineWidth = 2.5;
  if (mood === 'eat') {
    const op = Math.abs(Math.sin(t * 18));
    ctx.fillStyle = '#4a2a18'; ctx.beginPath(); ctx.ellipse(0, 13, 9, 3 + op * 6, 0, 0, TAU); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath();
    if (mood === 'angry') { ctx.moveTo(-12, 16); ctx.quadraticCurveTo(0, 8, 12, 16); }
    else { ctx.moveTo(-14, 8); ctx.quadraticCurveTo(0, 20, 14, 8); }
    ctx.stroke();
    ctx.fillStyle = '#fff6e0';
    for (const fx of [-7, 7]) {
      const fy = mood === 'angry' ? 12 : 13;
      ctx.beginPath(); ctx.moveTo(fx - 3, fy); ctx.lineTo(fx + 3, fy); ctx.lineTo(fx, fy + 7); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  ctx.restore();
}

// 目（共通）
function drawFaceEyes(x1, y1, x2, y2, r, mood, resin) {
  ctx.lineWidth = 2.5; ctx.strokeStyle = WOOD_D;
  if (mood === 'happy' || mood === 'eat') {
    ctx.lineWidth = 3;
    for (const [ex, ey] of [[x1, y1], [x2, y2]]) { ctx.beginPath(); ctx.arc(ex, ey + 3, r * 0.75, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    return;
  }
  for (const [ex, ey] of [[x1, y1], [x2, y2]]) {
    const g = ctx.createRadialGradient(ex - r * 0.3, ey - r * 0.3, 1, ex, ey, r);
    g.addColorStop(0, '#d79a5c'); g.addColorStop(1, resin);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(ex - r * 0.35, ey - r * 0.35, r * 0.25, 0, TAU); ctx.fill();
  }
  if (mood === 'angry') {
    ctx.lineWidth = 3.5; ctx.strokeStyle = WOOD_D;
    ctx.beginPath(); ctx.moveTo(x1 - r - 2, y1 - r - 6); ctx.lineTo(x1 + r, y1 - r + 1);
    ctx.moveTo(x2 + r + 2, y2 - r - 6); ctx.lineTo(x2 - r, y2 - r + 1); ctx.stroke();
  }
}

// ---------- かぼちゃ魔女 ----------
function drawPumpkin(x, y, s, o = {}) {
  const t = o.t || 0, mood = o.mood || 'normal';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.rot) ctx.rotate(o.rot);
  const body = new Path2D();
  body.ellipse(0, 18, 64, 48, 0, 0, TAU);
  const g = ctx.createLinearGradient(0, -30, 0, 66);
  g.addColorStop(0, '#d8954e'); g.addColorStop(0.55, '#a5643f'); g.addColorStop(1, '#6a4c86');
  ctx.fillStyle = mood === 'angry' ? '#c65040' : g; ctx.fill(body);
  gloss(body, -64, -30, 128, 96);
  bubbles([[-40, 30, 1.6], [44, 6, 1.3], [30, 44, 1.2], [-20, 50, 1]]);
  const lobes = new Path2D();
  lobes.moveTo(-24, -28); lobes.quadraticCurveTo(-52, 18, -24, 64);
  lobes.moveTo(24, -28); lobes.quadraticCurveTo(52, 18, 24, 64);
  laser(lobes, 5);
  laser(body, 6);
  // 目
  if (mood === 'happy' || mood === 'eat') {
    ctx.strokeStyle = WOOD_D; ctx.lineWidth = 9;
    for (const ex of [-18, 18]) { ctx.beginPath(); ctx.arc(ex, 12, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    ctx.strokeStyle = WOOD; ctx.lineWidth = 6;
    for (const ex of [-18, 18]) { ctx.beginPath(); ctx.arc(ex, 12, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else {
    for (const ex of [-18, 18]) {
      const e = new Path2D();
      const tilt = mood === 'angry' ? (ex < 0 ? 5 : -5) : 0;
      e.moveTo(ex - 11, 16); e.lineTo(ex + tilt * 0.4, -6 + Math.abs(tilt)); e.lineTo(ex + 11, 16 - tilt); e.closePath();
      ctx.fillStyle = WOOD; ctx.fill(e); ctx.strokeStyle = WOOD_D; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(e);

  }

  const cone = new Path2D();
  const sway = Math.sin(t * 1.6) * 4;
  cone.moveTo(-32, -32); cone.quadraticCurveTo(-14, -72, 6 + sway * 0.5, -98);
  cone.quadraticCurveTo(26 + sway, -104, 44 + sway, -90);
  cone.quadraticCurveTo(20, -84, 30, -32); cone.closePath();
  ctx.fillStyle = blueResin(-104, -30); ctx.fill(cone);
  gloss(cone, -32, -104, 80, 74);
  bubbles([[-6, -54, 1.5], [10, -70, 1.1]]);
  laser(cone, 5);
  const brim = new Path2D();
  brim.ellipse(0, -30, 62, 12, 0, 0, TAU);
  ctx.fillStyle = blueResin(-42, -18); ctx.fill(brim);
  laser(brim, 5);
  ctx.fillStyle = WOOD_D; ctx.beginPath(); ctx.arc(34 + sway, -90, 3.2, 0, TAU); ctx.fill();

}

// ---------- おばけ ----------
function drawGhost(x, y, s, o = {}) {
  const t = o.t || 0, mood = o.mood || 'normal';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.rot) ctx.rotate(o.rot);
  ctx.globalAlpha *= o.alpha ?? 1;
  const p = new Path2D();
  p.moveTo(-46, 40); p.lineTo(-46, -8); p.arc(0, -8, 46, Math.PI, 0); p.lineTo(46, 40);
  const n = 4, wv = 92 / n;
  for (let i = 0; i < n; i++) {
    const x0 = 46 - i * wv;
    const a = Math.sin(t * 4 + i) * 5;
    p.quadraticCurveTo(x0 - wv / 2, 58 + a, x0 - wv, 40);
  }
  p.closePath();
  // 腕
  const arms = new Path2D();
  const wave = Math.sin(t * 3) * 0.3;
  arms.ellipse(-52, 12, 12, 7, -0.6 - wave, 0, TAU);
  arms.ellipse(52, 12, 12, 7, 0.6 + wave, 0, TAU);
  const g = ctx.createLinearGradient(0, -54, 0, 58);

  ctx.fillStyle = g; ctx.fill(arms); laser(arms, 3.5);
  ctx.fillStyle = g; ctx.fill(p);
  gloss(p, -46, -54, 92, 112);
  bubbles([[-26, 20, 1.6], [30, -26, 1.2], [18, 30, 1.1]]);
  laser(p, 6);
  // 顔
  if (mood === 'happy' || mood === 'eat') {
    drawFaceEyes(-16, -8, 16, -8, 9, mood, '#2a2f55');
  } else {
    for (const ex of [-16, 16]) {
      ctx.fillStyle = '#262b55'; ctx.beginPath(); ctx.ellipse(ex, -8, 7.5, 10.5, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = WOOD; ctx.lineWidth = 3; ctx.stroke();

  const open = mood === 'eat' ? Math.abs(Math.sin(t * 18)) : 0;
  ctx.fillStyle = '#262b55'; ctx.strokeStyle = WOOD; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 12, mood === 'angry' ? 9 : 6, mood === 'angry' ? 3 : 7 + open * 5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

const WOLF_L = [[0, -34], [-20, -38], [-42, -84], [-52, -24], [-68, -8], [-56, 4], [-70, 22], [-50, 26], [-56, 46], [-28, 46], [0, 62]];

  // 目（満月で光る）
  if (mood === 'happy' || mood === 'eat') {

      ctx.restore();

      ctx.fillStyle = '#1a1208'; ctx.beginPath(); ctx.ellipse(ex, -6, 2.4, 6, 0, 0, TAU); ctx.fill();

function drawMonster(type, x, y, s, o) {
  if (type === 'bat') drawBat(x, y, s * 0.72, o);

function riceShape() {

function neta(fill, edgeFn) {
  const p = new Path2D();
  p.moveTo(-36, 2); p.bezierCurveTo(-30, -18, 24, -22, 38, -2); p.bezierCurveTo(32, 8, -26, 10, -36, 2); p.closePath();
  ctx.fillStyle = fill; ctx.fill(p);
  ctx.save(); ctx.clip(p); if (edgeFn) edgeFn();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(-4, -12, 20, 3, -0.08, 0, TAU); ctx.fill();
  ctx.restore();
  return p;
}
function drawSushi(type, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (type === 'ikura') {
    const nori = ctx.createLinearGradient(-28, 0, 28, 0);
    nori.addColorStop(0, '#0f1a14'); nori.addColorStop(0.5, '#2a3a2e'); nori.addColorStop(1, '#0f1a14');
    ctx.fillStyle = nori; ctx.beginPath(); ctx.roundRect(-26, -8, 52, 26, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let i = -20; i < 26; i += 8) { ctx.beginPath(); ctx.moveTo(i, -6); ctx.lineTo(i + 3, 16); ctx.stroke(); }
    const pts = [];
    for (let row = 0; row < 3; row++) for (let i = 0; i < 6 - row; i++) pts.push([-20 + row * 4.5 + i * 8, -8 - row * 6]);
    for (const [ix, iy] of pts) {
      const g = ctx.createRadialGradient(ix - 1.5, iy - 1.5, 0.5, ix, iy, 5.2);
      g.addColorStop(0, '#ffc28a'); g.addColorStop(0.5, '#f26a1b'); g.addColorStop(1, '#b8380a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ix, iy, 5.2, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(ix - 1.7, iy - 1.8, 1.2, 0, TAU); ctx.fill();
    }
  } else if (type === 'tamago') {
    riceShape();
    const g = ctx.createLinearGradient(0, -18, 0, 6);
    g.addColorStop(0, '#d89a34'); g.addColorStop(0.25, '#f7d550'); g.addColorStop(1, '#f2c83c');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-32, -18, 64, 22, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(180,120,30,0.4)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-30, -10 + i * 5); ctx.lineTo(30, -10 + i * 5); ctx.stroke(); }
    ctx.fillStyle = '#16231a'; ctx.fillRect(-6, -19, 12, 32);
  } else {
    riceShape();
    if (type === 'maguro') {
      const g = ctx.createLinearGradient(0, -20, 0, 8); g.addColorStop(0, '#e8283a'); g.addColorStop(1, '#a50f1e');
      neta(g, () => {
        ctx.strokeStyle = 'rgba(255,180,190,0.22)'; ctx.lineWidth = 2;
        for (let i = -30; i < 40; i += 12) { ctx.beginPath(); ctx.moveTo(i, -20); ctx.quadraticCurveTo(i + 8, -6, i + 2, 10); ctx.stroke(); }
      });
      ctx.fillStyle = '#2f7a2f';
      for (const [gx, gy] of [[4, -13], [8, -12], [6, -16], [2, -15], [9, -15]]) { ctx.beginPath(); ctx.arc(gx, gy, 2.4, 0, TAU); ctx.fill(); }
    } else if (type === 'saba') {
      const g = ctx.createLinearGradient(0, -20, 0, 8); g.addColorStop(0, '#d9e2ea'); g.addColorStop(0.5, '#8ea4b6'); g.addColorStop(1, '#5c6e66');
      neta(g, () => {
        ctx.strokeStyle = 'rgba(30,45,60,0.75)'; ctx.lineWidth = 2;
        for (let i = -30; i < 36; i += 9) { ctx.beginPath(); ctx.moveTo(i, -20); ctx.lineTo(i + 4, -12); ctx.lineTo(i, -6); ctx.stroke(); }
        ctx.fillStyle = 'rgba(200,230,210,0.35)'; ctx.fillRect(-40, -2, 80, 12);
      });
    } else if (type === 'buri') {
      const g = ctx.createLinearGradient(-36, 0, 38, 0); g.addColorStop(0, '#f4e6d0'); g.addColorStop(0.8, '#ecd0b8'); g.addColorStop(1, '#c86a5c');
      neta(g, () => {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
        for (let i = -30; i < 36; i += 10) { ctx.beginPath(); ctx.moveTo(i, 8); ctx.quadraticCurveTo(i + 10, -6, i + 4, -20); ctx.stroke(); }
      });
      for (const [gx, gy, r] of [[-8, -11, 3], [-4, -12, 3], [-6, -8, 2.6], [-1, -10, 2.4], [-10, -8, 2.2]]) {
        ctx.fillStyle = '#f08a26'; ctx.beginPath(); ctx.arc(gx, gy, r, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,240,200,0.7)'; ctx.beginPath(); ctx.arc(-7, -12, 1, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}
function drawPlate(x, y, s = 1) {

}

let G = null;
let best = 0;
try { best = +localStorage.getItem('obakeSushiBest') || 0; } catch (e) {}
const titleT = { t: 0 };

function newGame() {
  G = {

function makeCloud(x) {
  const w = rand(200, 320);
  const puffs = Array.from({ length: 6 }, (_, i) => ({ dx: (i / 5 - 0.5) * w * 0.8, dy: rand(-14, 10), r: rand(28, 46) }));
  return { x: x ?? -w, y: rand(120, 400), w, speed: rand(11, 20), puffs };
}

function moonPos() {
  const p = G ? clamp(G.t / G.nightLen, 0, 1) : 0.5;
  return { x: 130 + 460 * p, y: 440 - Math.sin(p * Math.PI) * 268, r: 104 };
}

function addFloat(text, x, y, color = '#fff', size = 30) { G.floats.push({ text, x, y, life: 1.3, max: 1.3, color, size }); }
function burst(x, y, n, colors, spd = 200, size = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(spd * 0.3, spd);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rand(0.5, 1), max: 1, color: pick(colors), size: rand(size * 0.5, size), g: 400 });
  }
}
function coinFly(x, y, n) {
  for (let i = 0; i < n; i++) G.particles.push({ coin: true, x: x + rand(-14, 14), y: y + rand(-14, 14), sx: x, sy: y, t: -i * 0.06, life: 1, max: 1 });
}

// ---------- お客さん ----------
function spawnCustomer() {
  const free = [];
  G.customers.forEach((c, i) => { if (!c) free.push(i); });
  if (!free.length) return;
  const seat = pick(free);
  const p = G.t / G.nightLen;
  const pool = ['bat', 'bat', 'pumpkin', 'pumpkin'];
  if (G.t > 18) pool.push('ghost', 'ghost');
  if (G.t > 40) { pool.push('wolf'); if (G.moonClear) pool.push('wolf', 'wolf'); }
  const type = pick(pool);
  const n = type === 'bat' ? 1 : type === 'pumpkin' ? (Math.random() < 0.5 ? 1 : 2) : type === 'ghost' ? 2 : 3;
  const orders = [];
  for (let i = 0; i < n; i++) orders.push(type === 'wolf' && Math.random() < 0.5 ? 'maguro' : pick(NETA).id);
  const pat = lerp(24, 14, p) * CUST_INFO[type].pat * (1 + (n - 1) * 0.25);
  G.customers[seat] = {
    type, seat, x: SEAT_X[seat], orders, total: n,
    patience: pat, maxPat: pat, state: 'arrive', t: rand(0, 6), stateT: 0, mood: 'normal',
    changeAt: type === 'pumpkin' && Math.random() < 0.55 ? rand(3, 7) : -1,
    eatType: null,
  };
  G.stacks[seat] = 0;
  G.visitors++;
  sfx('arrive');
}

function updateCustomers(dt) {
  for (let i = 0; i < 4; i++) {
    const c = G.customers[i];
    if (!c) continue;
    c.t += dt; c.stateT += dt;
    if (c.state === 'arrive') {
      if (c.stateT > 0.6) { c.state = 'wait'; c.stateT = 0; }
    } else if (c.state === 'wait') {
      c.patience -= dt;
      c.mood = c.patience / c.maxPat < 0.25 ? 'angry' : 'normal';
      if (c.changeAt > 0 && c.stateT > c.changeAt) {
        c.changeAt = -1;
        const others = NETA.filter(n => n.id !== c.orders[0]);
        c.orders[0] = pick(others).id;
        c.patience = Math.min(c.maxPat, c.patience + 4);
        addFloat('気が変わったわ！', c.x, CUST_Y - 140, '#c8b8ff', 24);
        burst(c.x, CUST_Y - 120, 18, ['#ffffff', '#b8a8ff', '#ffe08a'], 160, 4);
        sfx('spell');
      }
      if (c.patience <= 0) {
        c.state = 'leave'; c.stateT = 0; c.mood = 'angry'; c.angry = true;
        loseLife(c.x);
      }
    } else if (c.state === 'eat') {
      if (c.stateT > 0.8) {
        c.orders.shift();
        c.eatType = null;
        if (c.orders.length) {
          c.state = 'wait'; c.stateT = 0; c.mood = 'normal';
          c.patience = Math.min(c.maxPat, c.patience + c.maxPat * 0.35);
        } else {
          c.state = 'leave'; c.stateT = 0; c.mood = 'happy';
          const tip = Math.round(clamp(c.patience / c.maxPat, 0, 1) * 40 * c.total);
          if (tip > 0) { G.score += tip; addFloat('心付け +' + tip, c.x, CUST_Y - 150, '#ffe9a0', 22); }
          G.happy++;
          G.servedBy[c.type]++;
          burst(c.x, CUST_Y - 60, 14, ['#ffd86a', '#ff9ad0', '#9ad8ff'], 220, 5);
        }
      }
    } else if (c.state === 'leave') {
      if (c.stateT > 0.9) { G.customers[i] = null; G.stacks[i] = 0; }
    }
  }
}

function loseLife(x) {
  G.lives--;
  G.combo = 0;
  G.shake = 0.4;
  addFloat('プンプン！', x, CUST_Y - 140, '#ff7a7a', 30);
  sfx('angry'); setTimeout(() => sfx('lantern'), 250);
  if (G.lives <= 0) endNight('lives');
}

// ---------- 皿とレーン ----------
function placeNeta(i) {
  if (G.state !== 'play') return;
  if (G.cool[i] > 0) return;
  if (G.plates.some(p => !p.carried && Math.abs(p.x - DROP_X) < 80 && Math.abs(p.y - PLATE_Y) < 40)) {
    G.btnFlash[i] = 0.3; sfx('block'); return;
  }
  G.plates.push({ type: NETA[i].id, x: DROP_X, y: PLATE_Y - 60, vy: 0, loops: 0, carried: null, pop: 0 });
  G.cool[i] = 0.45;
  sfx('place');
  G.hintT = Math.min(G.hintT, 0);
}

function updatePlates(dt) {
  const v = G.beltSpeed;
  G.belt += v * dt;
  for (let k = G.plates.length - 1; k >= 0; k--) {
    const p = G.plates[k];
    if (p.carried) continue;
    if (p.y < PLATE_Y) { p.vy += 1400 * dt; p.y = Math.min(PLATE_Y, p.y + p.vy * dt); if (p.y === PLATE_Y) p.vy = 0; }
    p.x += v * dt;
    p.pop = Math.max(0, p.pop - dt);
    if (p.x > W + 45) {
      p.loops++;
      if (p.loops >= 2) {
        G.plates.splice(k, 1);
        G.discarded++; G.combo = 0;
        G.score = Math.max(0, G.score - 20);
        addFloat('廃棄… -20', W - 70, PLATE_Y - 60, '#a0a8c0', 22);
        sfx('discard');
        continue;
      }
      p.x -= W + 90;
    }
    if (p.y < PLATE_Y - 2 || G.state !== 'play') continue;
    for (const c of G.customers) {
      if (c && c.state === 'wait' && c.orders[0] === p.type && Math.abs(p.x - c.x) < 18) {
        serve(c, p);
        G.plates.splice(k, 1);
        break;
      }
    }
  }
}

function serve(c, p) {
  c.state = 'eat'; c.stateT = 0; c.mood = 'eat'; c.eatType = p.type; c.eatFrom = { x: p.x, y: p.y };
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  G.served++;
  const mult = (1 + Math.min(G.combo - 1, 10) * 0.1) * (G.moonClear ? 1.5 : 1) * CUST_INFO[c.type].pay;
  const gain = Math.round(NETA_BY_ID[p.type].price * mult);
  G.score += gain;
  G.stacks[c.seat]++;
  addFloat('+' + gain, c.x, CUST_Y - 20, G.moonClear ? '#fff2a0' : '#ffffff', 30);
  if (G.combo >= 3) addFloat(G.combo + 'コンボ！', c.x, CUST_Y + 16, '#ff9ad0', 22);
  coinFly(c.x, CUST_Y - 80, Math.min(6, 2 + Math.floor(gain / 60)));
  sfx('grab'); setTimeout(() => sfx('coin'), 200);
}

// ---------- いたずらコウモリ ----------
function spawnThief() {
  const side = Math.random() < 0.5 ? -1 : 1;
  G.thieves.push({ x: side < 0 ? -60 : W + 60, y: rand(120, 260), state: 'seek', target: null, t: 0, rot: 0, vx: 0, vy: 0, carry: null });
  sfx('squeak');
}
function updateThieves(dt) {
  for (let k = G.thieves.length - 1; k >= 0; k--) {
    const b = G.thieves[k];
    b.t += dt;
    if (b.state === 'seek') {
      if (!b.target || !G.plates.includes(b.target) || b.target.carried || b.target.y < PLATE_Y - 2) {
        const free = G.plates.filter(p => !p.carried && p.y >= PLATE_Y - 2 && p.x > 40 && p.x < W - 60);
        b.target = free.length ? pick(free) : null;
      }
      let tx, ty;
      if (b.target) { tx = b.target.x + G.beltSpeed * 0.35; ty = PLATE_Y - 34; }
      else { tx = W / 2 + Math.sin(b.t * 0.9) * 260; ty = 300 + Math.sin(b.t * 2.1) * 60; }
      const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy) || 1;
      const sp = 120 + Math.min(G.t, 150) * 0.6;
      b.x += dx / d * sp * dt; b.y += dy / d * sp * dt + Math.sin(b.t * 8) * 30 * dt;
      if (b.target && Math.hypot(b.target.x - b.x, (b.target.y - 34) - b.y) < 26) {
        b.state = 'escape'; b.carry = b.target; b.target.carried = b; b.vx = rand(-90, 90); b.vy = -60;
        sfx('steal');
      }
    } else if (b.state === 'escape') {
      b.vy -= 380 * dt; b.vy = Math.max(b.vy, -260);
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -80) {
        const idx = G.plates.indexOf(b.carry);
        if (idx >= 0) G.plates.splice(idx, 1);
        G.thieves.splice(k, 1);
        G.stolen++; G.combo = 0;
        addFloat('お寿司をとられた！', W / 2, 200, '#e0a0ff', 26);
        continue;
      }
    } else if (b.state === 'flee') {
      b.rot += dt * 14;
      b.vy -= 600 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -120) { G.thieves.splice(k, 1); continue; }
    }
    if (b.carry) { b.carry.x = b.x; b.carry.y = b.y + 34; }
  }
}
function shooThief(b) {
  b.state = 'flee'; b.vx = (b.x < W / 2 ? -1 : 1) * 260; b.vy = -260;
  if (b.carry) { b.carry.carried = null; b.carry.vy = 0; b.carry.loops = Math.min(b.carry.loops, 1); b.carry = null; }
  G.shoo++;

  burst(b.x, b.y, 16, ['#ffffff', '#c8a0ff', '#8a60c0'], 260, 5);
  sfx('shoo');
}

// ---------- お茶 ----------
function serveTea() {
  if (G.state !== 'play' || G.teaCD > 0) return;
  let any = false;
  for (const c of G.customers) {
    if (c && (c.state === 'wait' || c.state === 'eat')) {
      c.patience = Math.min(c.maxPat, c.patience + c.maxPat * 0.45);
      burst(c.x, CUST_Y - 30, 8, ['#b8e0a0', '#ffffff'], 120, 4);
      any = true;
    }
  }
  if (!any) { sfx('block'); return; }
  G.teaCD = G.teaMax;
  addFloat('あがりです', W / 2, CUST_Y - 180, '#c8f0b0', 28);
  sfx('tea');

// ---------- 夜の終わり ----------
function endNight(reason) {
  if (G.state !== 'play') return;
  G.state = 'closing'; G.endT = 0; G.endReason = reason;
  stopBGM(); sfx('end');
  if (G.score > best) { best = G.score; G.newBest = true; try { localStorage.setItem('obakeSushiBest', best); } catch (e) {} }
  const counts = Object.entries(G.servedBy).sort((a, b) => b[1] - a[1]);
  G.souvenir = counts[0][1] > 0 ? counts[0][0] : 'bat';
}
function rankOf(score) {
  if (score >= 16000) return ['月夜の伝説', '満月も見惚れる、伝説の握り手。'];
  if (score >= 10000) return ['月見の大将', 'おばけたちが行列をつくる名店。'];
  if (score >= 6000) return ['花板', 'カウンターを任せられる腕前。'];
  if (score >= 2500) return ['板前', 'なかなかの手さばき。'];

// ============================================================
//  更新
// ============================================================
function update(dt) {
  titleT.t += dt;
  if (!G || G.state === 'title') return;
  if (G.state === 'play') {
    G.t += dt;
    const p = clamp(G.t / G.nightLen, 0, 1);
    G.beltSpeed = lerp(105, 165, p);
    G.hintT -= dt;
    for (let i = 0; i < 5; i++) { G.cool[i] = Math.max(0, G.cool[i] - dt); G.btnFlash[i] = Math.max(0, G.btnFlash[i] - dt); }
    G.teaCD = Math.max(0, G.teaCD - dt);
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      spawnCustomer();
      G.spawnT = lerp(5.2, 2.4, p) * rand(0.8, 1.2);
    }
    if (G.t > 30) {
      G.thiefT -= dt;
      if (G.thiefT <= 0 && G.thieves.filter(b => b.state !== 'flee').length < 2) {
        spawnThief();
        G.thiefT = rand(12, 20) - p * 6;
      }
    }
    updateCustomers(dt);
    updatePlates(dt);
    updateThieves(dt);
    if (G.t >= G.nightLen) endNight('time');
  } else if (G.state === 'closing') {
    G.endT += dt;
    updatePlates(dt * 0.3);
    if (G.endT > 2.2) G.state = 'over';
  } else if (G.state === 'over') {
    G.endT += dt;
  }
  // 雲と月
  for (const c of G.clouds) {
    c.x += c.speed * dt;
    if (c.x - c.w > W + 40) Object.assign(c, makeCloud(-c.w - rand(40, 260)));
  }
  const m = moonPos();
  const covered = G.clouds.some(c => Math.abs(m.x - c.x) < c.w * 0.42 && Math.abs(m.y - c.y) < 62);
  if (G.state === 'play' && !covered && !G.moonClear) { addFloat('月が出た！ 月光ボーナス', W / 2, 520, '#fff2a0', 26); sfx('moon'); }
  G.moonClear = !covered;
  G.moonGlow = lerp(G.moonGlow, G.moonClear ? 1 : 0, Math.min(1, dt * 3));
  G.shake = Math.max(0, G.shake - dt);
  for (let i = 0; i < 3; i++) G.lanternFade[i] = lerp(G.lanternFade[i], i < G.lives ? 1 : 0, Math.min(1, dt * 4));
  G.shownScore = lerp(G.shownScore, G.score, Math.min(1, dt * 8));
  for (let k = G.particles.length - 1; k >= 0; k--) {
    const q = G.particles[k];
    if (q.coin) {
      q.t += dt * 1.6;
      if (q.t >= 1) { G.particles.splice(k, 1); continue; }
      continue;
    }
    q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life <= 0) G.particles.splice(k, 1);
  }
  for (let k = G.floats.length - 1; k >= 0; k--) {
    const f = G.floats[k]; f.life -= dt; f.y -= 40 * dt;
    if (f.life <= 0) G.floats.splice(k, 1);
  }
}

function drawParticles() {
  for (const q of G.particles) {
    if (q.coin) {
      if (q.t < 0) continue;
      const k = q.t, e = k * k;
      const x = lerp(q.x, 36, e), y = lerp(q.y, 32, e) - Math.sin(k * Math.PI) * 120;
      ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = '#a07010'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(x, y, 7, 10, 0, 0, TAU); ctx.fill(); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of G.floats) {
    const a = clamp(f.life / f.max * 1.5, 0, 1);
    const s = 1 + Math.max(0, (f.life - f.max + 0.15)) * 3;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(f.x, f.y); ctx.scale(s, s);
    ctx.font = `bold ${f.size}px ${SANS}`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,30,0.85)'; ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);

  }
}

function drawButton(b, label, sub, hue = 'red') {
  const hover = pointer.x > b.x && pointer.x < b.x + b.w && pointer.y > b.y && pointer.y < b.y + b.h;
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
  if (hover) ctx.scale(1.04, 1.04);
  const g = ctx.createLinearGradient(0, -b.h / 2, 0, b.h / 2);
  if (hue === 'red') { g.addColorStop(0, '#c8402a'); g.addColorStop(1, '#8a2014'); }
  else { g.addColorStop(0, '#3a4a7a'); g.addColorStop(1, '#222c50'); }
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(-b.w / 2 + 3, -b.h / 2 + 6, b.w, b.h, 18); ctx.fill();
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 18); ctx.fill();
  ctx.strokeStyle = WOOD; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff4dc'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${sub ? 30 : 32}px ${SERIF}`;
  ctx.fillText(label, 0, sub ? -10 : 0);
  if (sub) { ctx.font = `14px ${SANS}`; ctx.fillStyle = '#f0d0b0'; ctx.fillText(sub, 0, 22); }

function drawKeychain(type, x, y, s, t) {
  // 留め具＋リング＋キャラ（写真3のキーホルダー）
  ctx.save(); ctx.translate(x, y);
  const sw = Math.sin(t * 1.8) * 0.12;
  ctx.rotate(sw);
  const brass = ctx.createLinearGradient(-10, 0, 10, 0);
  brass.addColorStop(0, '#6a5a30'); brass.addColorStop(0.5, '#c8b070'); brass.addColorStop(1, '#6a5a30');
  // ナスカン
  ctx.strokeStyle = brass; ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8 * s, 0); ctx.quadraticCurveTo(-14 * s, -40 * s, 0, -46 * s); ctx.quadraticCurveTo(14 * s, -40 * s, 8 * s, -10 * s); ctx.stroke();
  ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.moveTo(8 * s, -10 * s); ctx.lineTo(-2 * s, -30 * s); ctx.stroke();
  ctx.fillStyle = brass; ctx.beginPath(); ctx.roundRect(-10 * s, -2 * s, 20 * s, 16 * s, 4 * s); ctx.fill();
  // リング
  ctx.strokeStyle = '#7a6a40'; ctx.lineWidth = 4 * s;
  ctx.beginPath(); ctx.arc(0, 26 * s, 13 * s, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,190,0.5)'; ctx.lineWidth = 1.5 * s;
  ctx.beginPath(); ctx.arc(0, 26 * s, 13 * s, -2.5, -1.2); ctx.stroke();
  const off = { bat: 90, pumpkin: 150, ghost: 100, wolf: 125 }[type];
  drawMonster(type, 0, (off) * s, s, { t, mood: 'happy' });
  ctx.restore();
}

  ctx.shadowColor = 'rgba(255,220,140,0.8)'; ctx.shadowBlur = 24;
  ctx.font = `bold 92px ${SERIF}`; ctx.fillStyle = '#fff2c8';
  ctx.fillText('満月', 360, 690);
  ctx.font = `bold 74px ${SERIF}`; ctx.fillStyle = '#ffcf80';
  ctx.fillText('おばけ寿司', 360, 785);
  ctx.restore();
  ctx.font = `20px ${SERIF}`; ctx.fillStyle = '#c8b8e8';
  ctx.fillText('〜 月夜の回転寿司、本日も開店 〜', 360, 846);
  // 遊び方
  ctx.fillStyle = 'rgba(10,8,30,0.6)'; ctx.beginPath(); ctx.roundRect(70, 872, 580, 100, 16); ctx.fill();
  ctx.fillStyle = '#e8dcc0'; ctx.font = `16px ${SANS}`;
  const lines = ['ネタをタップ → 注文したお客さんの前を通ると食べてくれる', '待たせすぎると提灯が消える。3つ消えたら店じまい', 'いたずらコウモリはタップで追い払え！ 月が出れば売上1.5倍'];
  lines.forEach((l, i) => ctx.fillText(l, 360, 898 + i * 26));
  drawButton(START_BTN, 'のれんをくぐる', 'タップで開店（Enter）');
  ctx.fillStyle = '#b8a888'; ctx.font = `18px ${SANS}`;
  ctx.fillText('最高売上  ' + best.toLocaleString() + ' 文', 360, 1122);
  ctx.fillStyle = 'rgba(200,190,170,0.45)'; ctx.font = `13px ${SANS}`;
  ctx.fillText('写真「満月」「お寿司」「ハロウィンのキーホルダー」から生まれたゲーム', 360, 1170);
  drawMute();
}

function drawOver() {
  const k = clamp(G.endT / 0.6, 0, 1);
  ctx.fillStyle = `rgba(5,4,18,${0.72 * k})`; ctx.fillRect(0, 0, W, H);
  if (k < 1) return;
  const t = G.endT;
  ctx.save();
  // パネル
  ctx.fillStyle = 'rgba(28,22,40,0.96)'; ctx.beginPath(); ctx.roundRect(50, 110, 620, 1050, 26); ctx.fill();
  ctx.strokeStyle = WOOD; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = WOOD_D; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(60, 120, 600, 1030, 20); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff0c8'; ctx.font = `bold 44px ${SERIF}`;
  ctx.fillText(G.endReason === 'time' ? '本日の営業終了' : '提灯が消えて店じまい…', 360, 175);
  ctx.font = `18px ${SANS}`; ctx.fillStyle = '#b8a8d0';
  ctx.fillText(G.endReason === 'time' ? '月が西の空へ沈んでいきます' : 'また次の満月の夜に', 360, 220);
  // 売上
  ctx.fillStyle = '#ffe9a0'; ctx.font = `bold 64px ${SANS}`;
  ctx.fillText(G.score.toLocaleString() + ' 文', 360, 292);
  if (G.newBest) {
    ctx.save(); ctx.translate(560, 250); ctx.rotate(0.2 + Math.sin(t * 4) * 0.05);
    ctx.fillStyle = '#d83a2a'; ctx.beginPath(); ctx.roundRect(-58, -18, 116, 36, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold 20px ${SANS}`; ctx.fillText('最高記録！', 0, 1);
    ctx.restore();
  }
  const [rank, desc] = rankOf(G.score);
  ctx.fillStyle = '#e8d4a8'; ctx.font = `18px ${SANS}`; ctx.fillText('今夜の称号', 360, 352);
  ctx.fillStyle = '#ffcf80'; ctx.font = `bold 40px ${SERIF}`; ctx.fillText('「' + rank + '」', 360, 394);
  ctx.fillStyle = '#c8b8a0'; ctx.font = `16px ${SANS}`; ctx.fillText(desc, 360, 432);
  // 成績
  const rows = [
    ['来店したおばけ', G.visitors + ' 名'],
    ['満足して帰った', G.happy + ' 名'],
    ['握ったお寿司', G.served + ' 貫'],
    ['最大コンボ', G.maxCombo],
    ['追い払ったコウモリ', G.shoo + ' 匹'],
    ['廃棄 / とられた', G.discarded + ' / ' + G.stolen + ' 皿'],
  ];
  ctx.font = `19px ${SANS}`;
  rows.forEach(([a, b], i) => {
    const y = 482 + i * 36;
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; if (i % 2 === 0) ctx.fillRect(110, y - 16, 500, 32);
    ctx.textAlign = 'left'; ctx.fillStyle = '#c8bca8'; ctx.fillText(a, 130, y);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff0d8'; ctx.fillText(String(b), 590, y);
  });
  // 記念キーホルダー
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8d4a8'; ctx.font = `bold 20px ${SERIF}`;
  ctx.fillText('〜 今夜の記念キーホルダー 〜', 360, 712);
  const glowG = ctx.createRadialGradient(360, 860, 10, 360, 860, 150);
  glowG.addColorStop(0, 'rgba(255,230,160,0.18)'); glowG.addColorStop(1, 'rgba(255,230,160,0)');
  ctx.fillStyle = glowG; ctx.fillRect(200, 720, 320, 300);
  drawKeychain(G.souvenir, 360, 770, 0.9, t);
  ctx.fillStyle = '#c8b8a0'; ctx.font = `16px ${SANS}`;
  ctx.fillText(CUST_INFO[G.souvenir].name + 'のお客さんに一番喜ばれました', 360, 1012);
  drawButton(RETRY_BTN, 'もう一晩', null, 'red');
  drawButton(TITLE_BTN, 'タイトルへ', null, 'blue');
  ctx.restore();
}

function render() {
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!G || G.state === 'title') {
    drawTitle();
    return;
  }
  ctx.save();
  if (G.shake > 0) ctx.translate(Math.sin(G.shake * 70) * 8 * G.shake, Math.cos(G.shake * 50) * 5 * G.shake);
  drawScene();
  ctx.restore();
  if (G.state === 'closing') {
    const k = clamp(G.endT / 1.2, 0, 1);
    ctx.save(); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 440, W, 200);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 72px ${SERIF}`; ctx.lineWidth = 8; ctx.strokeStyle = '#1a0a04';
    const txt = G.endReason === 'time' ? '閉　店' : '店じまい';
    ctx.strokeText(txt, 360, 540); ctx.fillStyle = '#ffe0a0'; ctx.fillText(txt, 360, 540);
    ctx.restore();
  }
  if (G.state === 'over') drawOver();
}

// ============================================================
//  入力
// ============================================================
const pointer = { x: -1, y: -1 };
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
cv.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toLogical(e);
  pointer.x = p.x; pointer.y = p.y;
  if (inBox(p, MUTE_BTN) && (!G || G.state === 'play' || G.state === 'title')) { setMuted(!muted); return; }
  if (!G || G.state === 'title') {
    if (inBox(p, START_BTN)) startGame();
    return;
  }
  if (G.state === 'play') {
    // コウモリ優先
    let hit = null, hd = 1e9;
    for (const b of G.thieves) {
      if (b.state === 'flee') continue;
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (d < 64 && d < hd) { hit = b; hd = d; }
    }
    if (hit) { shooThief(hit); return; }
    for (let i = 0; i < 5; i++) if (inBox(p, BTN[i])) { placeNeta(i); return; }
    if (inBox(p, TEA_BTN)) { serveTea(); return; }
  } else if (G.state === 'over' && G.endT > 1) {
    if (inBox(p, RETRY_BTN)) startGame();
    else if (inBox(p, TITLE_BTN)) { G.state = 'title'; sfx('arrive'); }
  }
});
addEventListener('keydown', e => {
  initAudio();
  if (!G || G.state === 'title') { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); } return; }
  if (G.state === 'play') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 5) placeNeta(n - 1);
    if (e.key === ' ') { e.preventDefault(); serveTea(); }
  } else if (G.state === 'over' && G.endT > 1 && e.key === 'Enter') startGame();
  if (e.key === 'm' || e.key === 'M') setMuted(!muted);
});
function startGame() {
  newGame();
  sfx('start');
  startBGM();
}

// ============================================================
//  メインループ
// ============================================================
// 最初はタイトル画面
G = { state: 'title' };
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
