<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D リバーシ — 8×8×8 立体オセロ</title>
<!--
AI Model: Claude Opus 4.8
User Prompt: 8x8x8で立体的に行うリバーシ（3D空間の立体オセロ）を作ってほしい
AI Approach: 外部ライブラリ不使用。8×8×8=512セルの立方体空間でプレイする立体リバーシ。
             石は26方向（3軸すべての ±/0 の組み合わせ、0,0,0を除く）に沿って挟んで返す。
             HTML5 Canvas 2D 上に自作の3Dレンダラ（透視投影・深度ソート・ビルボード球）を実装。
             立方体は自由回転・ズーム可能。「分解スライダー」でセル間隔を広げ内部を透視できる。
             合法手は光るマーカーで提示し、最寄り投影点でクリック判定。
             対戦AIはネガマックス+αβ枝刈り（立体位置評価＋着手可能数）で実装。
Implementation Intent: 平面盤の3D描画ではなく、真に立体空間（8^3）で挟み返すリバーシを実現する。
-->
<style>
  :root{ --glass:rgba(20,24,38,.62); --brd:rgba(255,255,255,.10); --accent:#6fd3ff; --gold:#ffd98a; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #2a3350 0%, #121727 45%, #06080f 100%);
    color:#eef2ff;-webkit-user-select:none;user-select:none;touch-action:none;
  }
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:12px 16px;pointer-events:none;z-index:10;flex-wrap:wrap;}
  .brand{pointer-events:auto;font-weight:800;letter-spacing:.5px;font-size:18px;
    background:linear-gradient(90deg,var(--gold),#fff 40%,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand small{display:block;font-size:10px;letter-spacing:3px;color:#8fa0c8;-webkit-text-fill-color:#8fa0c8;font-weight:600;}
  .spacer{flex:1;}
  .scores{pointer-events:auto;display:flex;gap:10px;align-items:center;}
  .chip{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--brd);
    padding:8px 14px;border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 24px rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s;}
  .chip.active{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 30px rgba(90,150,255,.35);}
  .stone-ico{width:22px;height:22px;border-radius:50%;flex:none;}
  .stone-ico.b{background:radial-gradient(circle at 34% 30%, #7a7f8e, #1b1d24 62%, #05060a);box-shadow:inset 0 0 4px rgba(255,255,255,.3);}
  .stone-ico.w{background:radial-gradient(circle at 34% 30%, #ffffff, #d7dbe6 55%, #9aa1b4);box-shadow:inset 0 0 4px rgba(0,0,0,.2);}
  .chip .num{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:26px;text-align:center;}
  .chip .lab{font-size:11px;color:#9fb0d6;letter-spacing:1px;}

  .controls{pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn,select{pointer-events:auto;background:var(--glass);color:#eaf0ff;border:1px solid var(--brd);
    padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;transition:.18s;outline:none;}
  .btn:hover,select:hover{background:rgba(60,80,120,.55);border-color:rgba(140,180,255,.4);}
  .btn.off{opacity:.5;}
  select{appearance:none;padding-right:26px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239fb0d6'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;}

  .panel{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;
    background:var(--glass);border:1px solid var(--brd);padding:12px 14px;border-radius:14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10;width:210px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);}
  .panel .row{display:flex;align-items:center;gap:10px;font-size:12px;color:#c3cee8;}
  .panel .row label{flex:none;width:56px;color:#9fb0d6;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),#3a5aa8);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#eaf2ff;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#eaf2ff;border:none;cursor:pointer;}

  .statusbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
    background:var(--glass);border:1px solid var(--brd);padding:10px 18px;border-radius:16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.4);
    z-index:10;font-size:14px;font-weight:600;}
  .statusbar .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .hint{position:fixed;right:16px;bottom:16px;font-size:11px;color:#7f8fb5;z-index:10;text-align:right;line-height:1.7;pointer-events:none;}

  .overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:radial-gradient(600px 400px at 50% 40%, rgba(20,28,50,.55), rgba(5,7,12,.85));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .overlay.show{display:flex;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{text-align:center;padding:34px 44px;border-radius:22px;
    background:linear-gradient(160deg, rgba(40,50,80,.85), rgba(16,20,34,.92));
    border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:pop .45s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{font-size:30px;margin-bottom:6px;background:linear-gradient(90deg,var(--gold),#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card p{color:#aebbdd;margin-bottom:20px;font-size:15px;}
  .card .final{display:flex;gap:26px;justify-content:center;margin-bottom:22px;}
  .card .final .s{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;}
  .card .big-btn{background:linear-gradient(90deg,#4a8cff,#6fd3ff);color:#06122a;font-weight:800;border:none;
    padding:12px 30px;border-radius:14px;font-size:15px;cursor:pointer;box-shadow:0 10px 26px rgba(80,150,255,.4);transition:.18s;}
  .card .big-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(80,150,255,.55);}

  @media (max-width:720px){ .brand small,.chip .lab,.controls .lbl{display:none;} .panel{width:170px;} }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="topbar">
    <div class="brand">CUBE REVERSI<small>8 × 8 × 8</small></div>
    <div class="spacer"></div>
    <div class="scores">
      <div class="chip active" id="chip-b"><span class="stone-ico b"></span><span class="num" id="score-b">4</span><span class="lab">あなた</span></div>
      <div class="chip" id="chip-w"><span class="stone-ico w"></span><span class="num" id="score-w">4</span><span class="lab">CPU</span></div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <span class="lbl" style="font-size:12px;color:#9fb0d6;">難易度</span>
      <select id="difficulty" title="難易度">
        <option value="1">やさしい</option>
        <option value="2" selected>ふつう</option>
        <option value="3">つよい</option>
        <option value="4">鬼</option>
      </select>
      <button class="btn" id="hintBtn" title="合法手の表示切替">ヒント</button>
      <button class="btn" id="rotBtn" title="自動回転">自動回転</button>
      <button class="btn" id="newBtn">新規対局</button>
    </div>
  </div>

  <div class="panel">
    <div class="row"><label>拡大</label><input type="range" id="zoom" min="220" max="1300" value="560"></div>
    <div class="row"><label>すき間</label><input type="range" id="explode" min="100" max="320" value="190"></div>
    <div class="row"><label>表示</label>
      <select id="viewmode" style="flex:1;padding:6px 8px;font-size:12px;">
        <option value="all">全層まとめて</option>
        <option value="one">1層だけ表示</option>
      </select>
    </div>
    <div class="row" id="layerRow" style="display:none;"><label>層(高さ)</label>
      <input type="range" id="layer" min="1" max="8" value="1">
      <span id="layerNum" style="width:16px;text-align:center;font-weight:700;">1</span>
    </div>
    <div class="help" style="font-size:10.5px;color:#8194ba;line-height:1.55;">
      拡大＝画面上の大きさ<br>すき間＝層を離して<b>中の石を透視</b>
    </div>
  </div>

  <div class="statusbar" id="statusbar">
    <span class="dot" id="statusdot"></span>
    <span id="statustext">あなたの番です（黒）</span>
  </div>

  <div class="hint">
    ① ドラッグで回転 ／ ホイールで拡大<br>
    ② <b style="color:#8fe6c0;">緑に光るマス</b>をクリックして着手<br>
    ③ 見づらければ「1層だけ表示」で層を選ぶ
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="winTitle">勝利！</h1>
      <p id="winSub"></p>
      <div class="final">
        <div><span class="stone-ico b" style="display:inline-block;vertical-align:middle;margin-right:8px;"></span><span class="s" id="final-b">0</span></div>
        <div><span class="stone-ico w" style="display:inline-block;vertical-align:middle;margin-right:8px;"></span><span class="s" id="final-w">0</span></div>
      </div>
      <button class="big-btn" id="againBtn">もう一度</button>
    </div>
  </div>

<script>
"use strict";
/* =========================================================================
   CUBE REVERSI — 8x8x8 three-dimensional Othello
   512 cells. Flips propagate along all 26 directions in 3D space.
   Self-contained software 3D renderer (perspective + depth sort + billboard
   spheres). No external libraries.
   ========================================================================= */

const S = 8, NCELL = S*S*S;      // 512
const BLACK = 1, WHITE = 2, EMPTY = 0, HUMAN = BLACK;
const idx = (x,y,z)=> (x*64 + y*8 + z);

// ---- 26 direction vectors ----
const DIRS = [];
for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++)
  if (dx||dy||dz) DIRS.push([dx,dy,dz]);

// ---- Canvas ----
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

// ---- Camera ----
const cam = { yaw:-0.6, pitch:0.5, targetYaw:-0.6, targetPitch:0.5 };
let spacing = 1.90;     // cell gap (explode / see inside)
let focalV  = 560;      // zoom (magnification)
let focusLayer = -1;    // -1 = all layers, else 0..7 (Y level shown alone)
const CAM_DIST = 26;

function rotate(p){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const x1=p.x*cy + p.z*sy, z1=-p.x*sy + p.z*cy, y1=p.y;
  const cx=Math.cos(cam.pitch), sx=Math.sin(cam.pitch);
  return { x:x1, y:y1*cx - z1*sx, z:y1*sx + z1*cx };
}
function project(p){
  const c=rotate(p);
  let pz=c.z + CAM_DIST; if (pz<0.05) pz=0.05;
  const s=focalV/pz;
  return { x:W/2 + c.x*s, y:H/2 - c.y*s, depth:pz, s };
}
// cell -> world coords (centered), spacing = explode factor
function cellWorld(x,y,z){
  return { x:(x-3.5)*spacing, y:(y-3.5)*spacing, z:(z-3.5)*spacing };
}

// ---- helpers ----
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c){ return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
function easeOutBack(t){ const s=1.70158; return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2); }

const COL = {
  black:[30,32,42], white:[236,238,247],
  marker:[110,240,180]
};

// =========================================================================
//  Game state
// =========================================================================
let grid;              // Int8Array(512) logical
let pieces;            // Map index -> {x,y,z,value,anim}
let current, busy, gameOver, showHints=true, autoRotate=true;
let hoverIdx=-1;

function newGame(){
  grid = new Int8Array(NCELL);
  pieces = new Map();
  // central 2x2x2 checkerboard by parity
  for (const x of [3,4]) for (const y of [3,4]) for (const z of [3,4]){
    const v = ((x+y+z)&1)===0 ? BLACK : WHITE;
    place(x,y,z,v,false);
  }
  current=BLACK; busy=false; gameOver=false; hoverIdx=-1;
  hideOverlay(); updateHud(); refreshValid(); setStatus('あなたの番です（黒）', true);
}

function place(x,y,z,v,pop){
  const i=idx(x,y,z);
  grid[i]=v;
  const p={ x,y,z, value:v, anim: pop?{type:'pop',start:performance.now(),dur:280}:null };
  pieces.set(i,p);
}

// ---- rules ----
function opp(p){ return p===BLACK?WHITE:BLACK; }
function inb(v){ return v>=0 && v<S; }
function getFlips(g,x,y,z,p){
  if (g[idx(x,y,z)]!==EMPTY) return null;
  const o=opp(p); let out=null;
  for (const [dx,dy,dz] of DIRS){
    let cx=x+dx, cy=y+dy, cz=z+dz; const line=[];
    while (inb(cx)&&inb(cy)&&inb(cz) && g[idx(cx,cy,cz)]===o){
      line.push(idx(cx,cy,cz)); cx+=dx; cy+=dy; cz+=dz;
    }
    if (line.length && inb(cx)&&inb(cy)&&inb(cz) && g[idx(cx,cy,cz)]===p){
      if (!out) out=[]; for (const q of line) out.push(q);
    }
  }
  return out;
}
function validMoves(g,p){
  const m=[];
  for (let x=0;x<S;x++) for (let y=0;y<S;y++) for (let z=0;z<S;z++){
    const i=idx(x,y,z);
    if (g[i]!==EMPTY) continue;
    const f=getFlips(g,x,y,z,p);
    if (f) m.push({x,y,z,i,flips:f.length});
  }
  return m;
}
function countStones(g){
  let b=0,w=0;
  for (let i=0;i<NCELL;i++){ if (g[i]===BLACK) b++; else if (g[i]===WHITE) w++; }
  return {b,w};
}

// =========================================================================
//  Move + animation
// =========================================================================
let validCache=[];   // current player's valid moves (for input)

function refreshValid(){
  validCache = (!busy && !gameOver && current===HUMAN) ? validMoves(grid,current) : [];
}

function playMove(x,y,z,p){
  const flips=getFlips(grid,x,y,z,p);
  if (!flips) return false;
  busy=true; hoverIdx=-1; validCache=[];
  place(x,y,z,p,true);
  const now=performance.now();
  for (const fi of flips){
    grid[fi]=p;
    const pc=pieces.get(fi);
    const fx=(fi/64)|0, fy=((fi>>3)&7), fz=(fi&7);
    const dist=Math.abs(fx-x)+Math.abs(fy-y)+Math.abs(fz-z);
    pc.anim={ type:'flip', start:now+90+dist*45, dur:400, from:pc.value, to:p };
  }
  updateHud();
  waitAnim(()=>afterMove(p));
  return true;
}
function waitAnim(cb){
  const check=()=>{
    const now=performance.now(); let anim=false;
    pieces.forEach(pc=>{
      if (!pc.anim) return;
      if (now>=pc.anim.start+pc.anim.dur){
        if (pc.anim.type==='flip') pc.value=pc.anim.to;
        pc.anim=null;
      } else anim=true;
    });
    if (anim) requestAnimationFrame(check); else cb();
  };
  check();
}
function afterMove(justMoved){
  const next=opp(justMoved);
  if (validMoves(grid,next).length){ current=next; handoff(); return; }
  if (validMoves(grid,justMoved).length){
    current=justMoved;
    flashStatus((next===HUMAN?'あなた':'CPU')+'はパス');
    handoff(); return;
  }
  endGame();
}
function handoff(){
  if (gameOver) return;
  updateHud();
  if (current===HUMAN){ busy=false; refreshValid(); setStatus('あなたの番です（黒）', true); }
  else { busy=true; refreshValid(); setStatus('CPU 思考中…', false); setTimeout(aiMove, 380); }
}

// =========================================================================
//  Positional weights (3D) + AI
// =========================================================================
const W3 = new Float32Array(NCELL);
(function buildWeights(){
  for (let x=0;x<S;x++) for (let y=0;y<S;y++) for (let z=0;z<S;z++){
    const ext = (x===0||x===7)+(y===0||y===7)+(z===0||z===7);
    const near= (x===1||x===6)+(y===1||y===6)+(z===1||z===6);
    let w;
    if (ext===3) w=140;                 // 8 cube corners — most stable
    else if (ext===2) w=(near? -10 : 18); // edge (or C-cell next to corner)
    else if (ext===1) w=(near? -6 : 4);   // face
    else w=(near? -3 : -1);               // interior
    W3[idx(x,y,z)]=w;
  }
})();
function applyTo(g,x,y,z,p){
  const f=getFlips(g,x,y,z,p); if (!f) return false;
  g[idx(x,y,z)]=p; for (const q of f) g[q]=p; return true;
}
function evaluate(g,p){
  const o=opp(p); let pos=0, empt=0;
  for (let i=0;i<NCELL;i++){
    const v=g[i]; if (v===EMPTY){ empt++; continue; }
    if (v===p) pos+=W3[i]; else pos-=W3[i];
  }
  const my=validMoves(g,p).length, op=validMoves(g,o).length;
  const mob=(my+op)? 60*(my-op)/(my+op) : 0;
  let mat=0;
  if (empt<40){ const c=countStones(g); const mine=p===BLACK?c.b:c.w, th=p===BLACK?c.w:c.b; mat=6*(mine-th); }
  return pos + mob + mat;
}
function negamax(g,p,depth,alpha,beta){
  if (depth===0) return evaluate(g,p);
  const moves=validMoves(g,p);
  if (!moves.length){
    if (!validMoves(g,opp(p)).length){
      const c=countStones(g); const mine=p===BLACK?c.b:c.w, th=p===BLACK?c.w:c.b;
      return (mine-th)*100000;
    }
    return -negamax(g,opp(p),depth-1,-beta,-alpha);
  }
  moves.sort((a,b)=> W3[b.i]-W3[a.i]);
  let best=-Infinity;
  for (const m of moves){
    const ng=g.slice(); applyTo(ng,m.x,m.y,m.z,p);
    const val=-negamax(ng,opp(p),depth-1,-beta,-alpha);
    if (val>best) best=val;
    if (best>alpha) alpha=best;
    if (alpha>=beta) break;
  }
  return best;
}
function aiMove(){
  if (gameOver) return;
  const p=current, moves=validMoves(grid,p);
  if (!moves.length){ afterMove(opp(p)); return; }
  let depth=parseInt(document.getElementById('difficulty').value,10);
  const {b,w}=countStones(grid); const empt=NCELL-b-w;
  if (empt<=8) depth=Math.max(depth,6);         // endgame: read deeper
  moves.sort((a,b)=> W3[b.i]-W3[a.i]);
  let bestVal=-Infinity, best=[];
  for (const m of moves){
    const ng=grid.slice(); applyTo(ng,m.x,m.y,m.z,p);
    let val=-negamax(ng,opp(p),depth-1,-Infinity,Infinity);
    if (depth<=1) val+= Math.random()*10-5;     // easy: jitter
    if (val>bestVal+1e-6){ bestVal=val; best=[m]; }
    else if (Math.abs(val-bestVal)<1e-6) best.push(m);
  }
  const m=best[(Math.random()*best.length)|0];
  playMove(m.x,m.y,m.z,p);
}

// =========================================================================
//  Rendering
// =========================================================================
function render(){
  // background
  const g=ctx.createRadialGradient(W*0.5,H*0.16,60,W*0.5,H*0.55,Math.max(W,H)*0.85);
  g.addColorStop(0,'#28324f'); g.addColorStop(0.45,'#141a2b'); g.addColorStop(1,'#05070e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const items=[];

  // ---- cube wireframe + per-layer frames ----
  const lo=cellWorld(0,0,0), hi=cellWorld(7,7,7);
  addBox(items, lo, hi, 'rgba(150,180,255,0.16)', 1.4);
  for (let y=0;y<S;y++){
    const a=cellWorld(0,y,0), b=cellWorld(7,y,7);
    addLayerFrame(items, a.y, a.x, a.z, b.x, b.z, 'rgba(120,150,220,0.06)');
  }

  // ---- pieces (billboard spheres) ----
  pieces.forEach(pc=>{
    if (focusLayer>=0 && pc.y!==focusLayer && !pc.anim){
      // dimmed ghost for non-focused layers
      const w=cellWorld(pc.x,pc.y,pc.z); const pr=project(w);
      items.push({ kind:'sphere', depth:pr.depth, x:pr.x, y:pr.y, r:0.42*pr.s,
                   col: pc.value===BLACK?COL.black:COL.white, flash:0, alpha:0.12 });
      return;
    }
    let scale=1, disp=pc.value, flash=0;
    if (pc.anim){
      const t=clamp((performance.now()-pc.anim.start)/pc.anim.dur,0,1);
      if (pc.anim.type==='pop'){ scale=easeOutBack(t); }
      else { scale=1-0.30*Math.sin(t*Math.PI); disp=t<0.5?pc.anim.from:pc.anim.to; flash=Math.sin(t*Math.PI)*0.5; }
    }
    const w=cellWorld(pc.x,pc.y,pc.z);
    const pr=project(w);
    const rad=0.42*pr.s*scale;
    items.push({ kind:'sphere', depth:pr.depth, x:pr.x, y:pr.y, r:rad,
                 col: disp===BLACK?COL.black:COL.white, flash, alpha:1 });
  });

  // ---- valid-move markers (current player) — drawn on top of spheres ----
  const markers = (!busy && showHints && !gameOver && current===HUMAN) ? validCache : [];
  const pulse = 0.5+0.5*Math.sin(performance.now()/260);
  for (const m of markers){
    if (focusLayer>=0 && m.y!==focusLayer) continue;
    const w=cellWorld(m.x,m.y,m.z);
    const pr=project(w);
    const rad = 0.48*pr.s;
    const isHover = (m.i===hoverIdx);
    items.push({ kind:'marker', depth: pr.depth - 100, x:pr.x, y:pr.y, r:rad,
                 alpha:(isHover?1:0.5+0.35*pulse), hover:isHover });
  }

  // depth sort: far first
  items.sort((a,b)=> b.depth-a.depth);

  for (const it of items){
    if (it.kind==='line'){
      ctx.beginPath(); ctx.moveTo(it.x1,it.y1); ctx.lineTo(it.x2,it.y2);
      ctx.strokeStyle=it.color; ctx.lineWidth=it.lw||1; ctx.stroke();
    } else if (it.kind==='marker'){
      drawMarker(it);
    } else {
      drawSphere(it);
    }
  }
}

function addBox(items, lo, hi, color, lw){
  const c=[
    {x:lo.x,y:lo.y,z:lo.z},{x:hi.x,y:lo.y,z:lo.z},{x:hi.x,y:lo.y,z:hi.z},{x:lo.x,y:lo.y,z:hi.z},
    {x:lo.x,y:hi.y,z:lo.z},{x:hi.x,y:hi.y,z:lo.z},{x:hi.x,y:hi.y,z:hi.z},{x:lo.x,y:hi.y,z:hi.z}
  ];
  const E=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  for (const [a,b] of E) addLine(items, c[a], c[b], color, lw);
}
function addLayerFrame(items, y, x0,z0, x1,z1, color){
  const p=[{x:x0,y,z:z0},{x:x1,y,z:z0},{x:x1,y,z:z1},{x:x0,y,z:z1}];
  for (let i=0;i<4;i++) addLine(items, p[i], p[(i+1)%4], color, 1);
}
function addLine(items, a, b, color, lw){
  const pa=project(a), pb=project(b);
  items.push({ kind:'line', depth:(pa.depth+pb.depth)/2, x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y, color, lw });
}

function drawSphere(it){
  const {x,y,r,col}=it;
  if (r<0.4) return;
  ctx.globalAlpha = it.alpha!=null? it.alpha : 1;
  // contact shadow-ish dark halo
  const hx=x-r*0.34, hy=y-r*0.40;
  const hi=mix(col,[255,255,255], col[0]<120?0.55:0.9);
  const lo=mix(col,[0,0,0], 0.55);
  const gg=ctx.createRadialGradient(hx,hy,r*0.08, x,y,r*1.02);
  gg.addColorStop(0, rgb(hi));
  gg.addColorStop(0.5, rgb(col));
  gg.addColorStop(1, rgb(lo));
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=gg; ctx.fill();
  // subtle rim
  ctx.lineWidth=Math.max(0.6,r*0.06);
  ctx.strokeStyle= col[0]<120?'rgba(120,140,200,0.25)':'rgba(120,130,160,0.35)';
  ctx.stroke();
  // specular dot
  ctx.beginPath(); ctx.arc(hx,hy,r*0.16,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,'+(col[0]<120?0.5:0.85)+')'; ctx.fill();
  if (it.flash>0){
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+it.flash+')'; ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawMarker(it){
  const {x,y,r,alpha,hover}=it;
  const M=COL.marker; const c=M[0]+','+M[1]+','+M[2];
  // glowing halo
  const halo=ctx.createRadialGradient(x,y,r*0.1,x,y,r*1.4);
  halo.addColorStop(0,'rgba('+c+','+(alpha*0.55)+')');
  halo.addColorStop(1,'rgba('+c+',0)');
  ctx.beginPath(); ctx.arc(x,y,r*1.4,0,Math.PI*2); ctx.fillStyle=halo; ctx.fill();
  // filled disc
  ctx.beginPath(); ctx.arc(x,y,r*0.86,0,Math.PI*2);
  ctx.fillStyle='rgba('+c+','+(alpha*0.30)+')'; ctx.fill();
  // ring
  ctx.lineWidth=hover?3.4:2.2;
  ctx.strokeStyle='rgba('+c+','+alpha+')'; ctx.stroke();
  // plus sign
  ctx.beginPath();
  ctx.moveTo(x-r*0.34,y); ctx.lineTo(x+r*0.34,y);
  ctx.moveTo(x,y-r*0.34); ctx.lineTo(x,y+r*0.34);
  ctx.strokeStyle='rgba('+c+','+alpha+')'; ctx.lineWidth=2; ctx.stroke();
  if (hover){
    drawTooltip(x, y - r*1.5, 'ここに置く');
  }
}
function drawTooltip(px,py,txt){
  ctx.font='bold 13px "Segoe UI",sans-serif';
  const w=ctx.measureText(txt).width+18;
  const bx=px-w/2, by=py-24;
  ctx.fillStyle='rgba(10,14,24,0.9)';
  roundRect(bx,by,w,22,7); ctx.fill();
  ctx.strokeStyle='rgba(110,240,180,0.8)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle='#e6fff2';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt, px, by+11);
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// =========================================================================
//  Loop
// =========================================================================
function loop(){
  cam.yaw   += (cam.targetYaw-cam.yaw)*0.12;
  cam.pitch += (cam.targetPitch-cam.pitch)*0.12;
  if (autoRotate && !dragging){ cam.yaw+=0.0035; cam.targetYaw+=0.0035; }
  render();
  requestAnimationFrame(loop);
}

// =========================================================================
//  Interaction
// =========================================================================
let dragging=false, moved=false, lastX=0, lastY=0;

function pick(mx,my){
  // nearest valid-move marker in screen space (respecting layer focus)
  let best=null, bestD=1e9;
  for (const m of validCache){
    if (focusLayer>=0 && m.y!==focusLayer) continue;
    const pr=project(cellWorld(m.x,m.y,m.z));
    const d=Math.hypot(pr.x-mx, pr.y-my);
    if (d<bestD && d < 0.6*pr.s + 16){ bestD=d; best=m; }
  }
  return best;
}

canvas.addEventListener('pointerdown', e=>{
  dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY;
  canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if (dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
    cam.targetYaw  += dx*0.008;
    cam.targetPitch = clamp(cam.targetPitch + dy*0.006, -1.35, 1.35);
    lastX=e.clientX; lastY=e.clientY;
  } else {
    const m = (!busy&&current===HUMAN)? pick(e.clientX,e.clientY):null;
    hoverIdx = m? m.i : -1;
  }
});
canvas.addEventListener('pointerup', e=>{
  canvas.classList.remove('dragging');
  if (dragging && !moved) handleClick(e.clientX,e.clientY);
  dragging=false;
});
canvas.addEventListener('pointercancel', ()=>{ dragging=false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  focalV=clamp(focalV - e.deltaY*0.7, 220, 1300);
  document.getElementById('zoom').value=focalV;
},{passive:false});

function handleClick(mx,my){
  if (busy||gameOver||current!==HUMAN) return;
  const m=pick(mx,my);
  if (m) playMove(m.x,m.y,m.z,HUMAN);
}

// =========================================================================
//  HUD
// =========================================================================
function updateHud(){
  const {b,w}=countStones(grid);
  document.getElementById('score-b').textContent=b;
  document.getElementById('score-w').textContent=w;
  document.getElementById('chip-b').classList.toggle('active', current===BLACK && !gameOver);
  document.getElementById('chip-w').classList.toggle('active', current===WHITE && !gameOver);
}
let statusTimer=null;
function setStatus(txt,human){
  document.getElementById('statustext').textContent=txt;
  const d=document.getElementById('statusdot');
  d.style.background=human?'#6fd3ff':'#ffd98a';
  d.style.boxShadow='0 0 10px '+(human?'#6fd3ff':'#ffd98a');
}
function flashStatus(txt){
  setStatus(txt,current===HUMAN);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{ if(!gameOver) setStatus(current===HUMAN?'あなたの番です（黒）':'CPU 思考中…',current===HUMAN); },1400);
}
function endGame(){
  gameOver=true; busy=false; validCache=[];
  const {b,w}=countStones(grid); updateHud();
  document.getElementById('final-b').textContent=b;
  document.getElementById('final-w').textContent=w;
  let t,s;
  if (b>w){ t='あなたの勝ち！'; s='黒 '+b+' 対 白 '+w+' — お見事！'; }
  else if (w>b){ t='CPUの勝ち'; s='黒 '+b+' 対 白 '+w+' — 惜しい！'; }
  else { t='引き分け'; s='黒 '+b+' 対 白 '+w; }
  document.getElementById('winTitle').textContent=t;
  document.getElementById('winSub').textContent=s;
  setStatus('対局終了',true);
  setTimeout(()=>document.getElementById('overlay').classList.add('show'),500);
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

// ---- controls ----
document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('againBtn').addEventListener('click', newGame);
document.getElementById('hintBtn').addEventListener('click', function(){
  showHints=!showHints; this.classList.toggle('off',!showHints); refreshValid();
});
document.getElementById('rotBtn').addEventListener('click', function(){
  autoRotate=!autoRotate; this.classList.toggle('off',!autoRotate);
});
document.getElementById('explode').addEventListener('input', e=>{ spacing=e.target.value/100; });
document.getElementById('zoom').addEventListener('input', e=>{ focalV=parseFloat(e.target.value); });
document.getElementById('viewmode').addEventListener('change', e=>{
  const one = e.target.value==='one';
  document.getElementById('layerRow').style.display = one? 'flex':'none';
  focusLayer = one ? (parseInt(document.getElementById('layer').value,10)-1) : -1;
});
document.getElementById('layer').addEventListener('input', e=>{
  document.getElementById('layerNum').textContent=e.target.value;
  focusLayer = parseInt(e.target.value,10)-1;
});

// go
newGame();
loop();
</script>
