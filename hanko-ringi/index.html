<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全自動稟議地獄</title>
<style>
  :root {
    --paper: #f6f0e1;
    --paper-dark: #e8dec5;
    --ink: #2b2620;
    --shu: #c8261d;
    --line: #8a7e66;
    --desk: #5b4632;
    --ok: #3c6e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 2px, transparent 2px 40px),
      linear-gradient(#6b533b, var(--desk));
    min-height: 100vh;
  }
  header {
    background: #1f2a44;
    color: #f3f0e8;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 4px solid var(--shu);
  }
  header h1 { font-size: 1.25rem; margin: 0; letter-spacing: .1em; }
  header h1 small { font-size: .7rem; opacity: .8; display: block; letter-spacing: 0; }
  #clock { font-family: monospace; font-size: .9rem; text-align: right; }
  .ticker { background: #11182b; color: #e2b007; overflow: hidden; white-space: nowrap; font-size: .8rem; padding: 3px 0; }
  .ticker-in { display: inline-block; padding-left: 100%; animation: tick 60s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }
  main {
    max-width: 880px;
    margin: 16px auto;
    padding: 0 16px 60px;
  }
  .sheet {
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .sheet h2 {
    text-align: center;
    letter-spacing: .6em;
    margin: 0 0 14px;
    font-size: 1.4rem;
    border-bottom: 3px double var(--ink);
    padding-bottom: 6px;
  }
  label { display: block; font-weight: bold; margin: 10px 0 4px; }
  select, textarea, input[type=text] {
    width: 100%;
    font: inherit;
    padding: 6px 8px;
    background: #fffdf6;
    border: 1px solid var(--line);
  }
  textarea { height: 70px; resize: vertical; }
  button {
    font: inherit;
    cursor: pointer;
    background: var(--shu);
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 1rem;
    letter-spacing: .2em;
    box-shadow: 0 3px 0 #7d1610;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d1610; }
  button:disabled { background: #999; box-shadow: 0 3px 0 #666; cursor: not-allowed; }
  button.sub { background: #4a4a4a; box-shadow: 0 3px 0 #222; }
  .center { text-align: center; margin-top: 16px; }

  /* 押印欄 */
  .route {
    display: flex;
    flex-direction: row-reverse; /* 日本の押印欄は右から左へ偉くなる…わけではないが雰囲気で */
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0;
    border: 2px solid var(--ink);
    margin: 14px 0;
  }
  .cell {
    width: 84px;
    border-left: 1px solid var(--ink);
    text-align: center;
    background: #fffdf6;
  }
  .cell:last-child { border-left: none; }
  .cell .role {
    font-size: .72rem;
    border-bottom: 1px solid var(--ink);
    padding: 2px 0;
    background: var(--paper-dark);
    white-space: nowrap;
    overflow: hidden;
  }
  .cell canvas { width: 80px; height: 80px; display: block; margin: 0 auto; }
  .cell.active { outline: 3px solid #e2b007; outline-offset: -3px; animation: blink 1s infinite; }
  .cell .date { font-size: .6rem; height: 14px; color: #555; font-family: monospace; }
  @keyframes blink { 50% { outline-color: transparent; } }

  #log {
    font-family: monospace;
    font-size: .82rem;
    max-height: 220px;
    overflow-y: auto;
    background: #fffdf6;
    border: 1px inset var(--line);
    padding: 8px;
    white-space: pre-wrap;
  }
  #log .rej { color: var(--shu); font-weight: bold; }
  #log .ok { color: var(--ok); }
  #log .sys { color: #666; }

  .banner {
    position: absolute;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%) rotate(-12deg);
    font-size: 3.2rem;
    font-weight: bold;
    color: var(--shu);
    border: 6px solid var(--shu);
    padding: 4px 18px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    letter-spacing: .2em;
    white-space: nowrap;
    background: rgba(246,240,225,.6);
  }
  .banner.show { animation: slam .35s ease-out forwards; }
  @keyframes slam {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(3); }
    100% { opacity: .9; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
  }
  .hidden { display: none; }
  .docinfo { display: grid; grid-template-columns: 7em 1fr; gap: 4px 10px; font-size: .95rem; }
  .docinfo div:nth-child(odd) { font-weight: bold; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .stats div { background: #fffdf6; border: 1px solid var(--line); padding: 6px 8px; font-size: .85rem; }
  .stats span { display: block; font-size: .7rem; color: #666; }
  .stats b { font-size: 1.25rem; font-family: monospace; margin-right: 2px; }
  .ach-title { margin: 18px 0 6px; font-size: 1rem; border-left: 6px solid var(--shu); padding-left: 8px; }
  .ach { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
  .ach li { background: #e5ddc9; color: #888; padding: 6px 8px; font-size: .82rem; border: 1px dashed var(--line); }
  .ach li.got { background: #fffdf6; color: var(--ink); border-style: solid; }
  .ach li span { margin-right: 6px; }
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
  .toast {
    background: #1f2a44; color: #fff; padding: 10px 14px; border-left: 6px solid #e2b007;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); animation: tin .3s ease-out; transition: opacity .6s, transform .6s;
  }
  .toast.out { opacity: 0; transform: translateX(40px); }
  @keyframes tin { from { opacity: 0; transform: translateX(40px); } }

  .nema { margin-top: 14px; border: 1px solid var(--line); background: #fbf6e8; padding: 6px 10px; }
  .nema summary { cursor: pointer; font-weight: bold; }
  .nema .note { font-size: .8rem; color: #555; margin: 6px 0; }
  .nema-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .nema-btn { background: #fffdf6; color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 0 var(--line); padding: 6px 4px; font-size: .85rem; letter-spacing: 0; }
  .nema-btn.done { background: #e9f2e4; border-color: var(--ok); }
  #nemaLog { font-family: monospace; font-size: .75rem; max-height: 110px; overflow-y: auto; margin-top: 6px; }
  .fax-machine { background: #d8d4c8; padding: 10px; border-radius: 8px; border: 2px solid #9a968a; }
  .fax-lcd { background: #9fb38a; color: #1c2a12; font-family: monospace; font-size: .8rem; padding: 4px 6px; margin-bottom: 8px; min-height: 1.6em; text-align: left; }
  #faxPaper { width: 100%; max-width: 260px; background: #f7f5ee; box-shadow: inset 0 0 6px rgba(0,0,0,.2); }
  .cell.extra { animation: drop .4s ease-out; }
  @keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
  .zukan { margin-top: 14px; }
  .zukan summary { cursor: pointer; font-weight: bold; border-left: 6px solid var(--shu); padding-left: 8px; }
  .zukan ol { list-style: none; padding: 0; margin: 8px 0 0; max-height: 320px; overflow-y: auto; }
  .zukan li { background: #fffdf6; border: 1px solid var(--line); border-top: none; padding: 5px 8px; font-size: .82rem; display: flex; gap: 8px; align-items: baseline; }
  .zukan li:first-child { border-top: 1px solid var(--line); }
  .zukan .no { font-family: monospace; color: #888; flex: none; }
  .zukan .cnt { margin-left: auto; font-family: monospace; color: var(--shu); flex: none; }
  .tabs { display: flex; gap: 4px; margin-bottom: -1px; }
  .tab { background: #c9bda0; color: var(--ink); box-shadow: none; letter-spacing: .1em; padding: 8px 16px; border: 1px solid var(--line); border-bottom: none; }
  .tab.on { background: var(--paper); font-weight: bold; }
  .note { font-size: .85rem; color: #555; }
  .desk-wrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  #desk { width: 100%; height: auto; display: block; cursor: none; border: 1px solid var(--line); }
  #goHome { position: absolute; right: 10px; top: 10px; font-size: .8rem; padding: 6px 10px; transition: left .15s, top .15s; }
  .desk-hud { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: monospace; font-size: .9rem; margin-top: 8px; }
  .seal-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  #sealPreview { width: 72px; height: 72px; background: #fffdf6; border: 1px dashed var(--line); flex: none; }
  #sealDesc { font-size: .85rem; margin: 0; color: #555; }

  .bubble {
    position: absolute;
    transform: translate(-50%, -100%) scale(.6);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 6px 10px;
    font-size: .85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 5;
    text-align: center;
  }
  .bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -10px; margin-left: -8px;
    border: 8px solid transparent; border-top-color: var(--ink); border-bottom: 0;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #kind option { max-width: 100%; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal.hidden { display: none; }
  .modal-box {
    background: var(--paper);
    padding: 18px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .modal-box h3 { margin: 0 0 6px; letter-spacing: .4em; }
  .modal-box p { font-size: .85rem; margin: 4px 0 8px; }
  #stampPreview { background: #fffdf6; border: 1px dashed var(--line); width: 220px; height: 220px; }
  #angleText { font-family: monospace; margin: 4px 0; }
  .ink { height: 10px; background: #ddd; margin: 6px 0 12px; border: 1px solid var(--line); }
  #inkMeter { height: 100%; width: 0; background: var(--shu); transition: width .15s; }
  .btns { display: flex; gap: 10px; justify-content: center; }

  @media (max-width: 600px) {
    .cell { width: 25%; }
    .cell canvas { width: 64px; height: 64px; }
    .banner { font-size: 2rem; }
  }
</style>
</head>
<body>
<header>
  <h1>全自動稟議地獄<small>〜何ひとつ承認されないワークフロー〜</small></h1>
  <div id="clock"></div>
</header>
<div class="ticker"><div class="ticker-in" id="ticker"></div></div>

<main>
  <nav class="tabs">
    <button class="tab on" data-mode="apply">申請する側</button>
    <button class="tab" data-mode="approve">決裁する側</button>
  </nav>
  <div id="modeApply">
  <!-- 申請フォーム -->
  <section class="sheet" id="formSheet">
    <h2>稟議申請書</h2>
    <label for="kind">申請種別</label>
    <select id="kind"></select>
    <label for="reason">申請理由（具体的に、かつ簡潔に、しかし詳細に）</label>
    <textarea id="reason" placeholder="例：ペンのインクが切れたため"></textarea>
    <label for="applicant">申請者氏名（印鑑の作成に使用します）</label>
    <input type="text" id="applicant" maxlength="4" value="山田">
    <label for="seal">使用する印鑑</label>
    <select id="seal"></select>
    <div class="seal-row">
      <canvas id="sealPreview" width="120" height="120"></canvas>
      <p id="sealDesc"></p>
    </div>
    <details class="nema">
      <summary>根回し（任意・推奨・事実上必須）</summary>
      <p class="note">提出前に決裁者へ話を通しておくと、通りやすくなる…かもしれません。ただし誰かを飛ばすと「頭越し」になります。</p>
      <div class="nema-grid" id="nemaGrid"></div>
      <div id="nemaLog"></div>
    </details>
    <div class="center">
      <button id="submitBtn">提出する</button>
    </div>
  </section>

  <!-- 審査状況 -->
  <section class="sheet hidden" id="flowSheet">
    <h2>決裁状況</h2>
    <div class="docinfo" id="docinfo"></div>
    <div class="route" id="route"></div>
    <div id="log"></div>
    <div class="center">
      <button class="sub hidden" id="retryBtn">再申請する</button>
    </div>
    <div class="banner" id="banner">差戻</div>
    <div class="bubble" id="bubble"></div>
  </section>

  </div><!-- /modeApply -->

  <!-- 決裁者モード -->
  <div id="modeApprove" class="hidden">
    <section class="sheet" id="deskSheet">
      <h2>決裁業務</h2>
      <p class="note">あなたは課長です。届いた稟議書の「課長」欄に、お辞儀の角度（左8〜25°）で押印してください。右クリック（スマホは長押し）で差し戻し。怪しい書類には注意。</p>
      <div class="desk-wrap" id="deskWrap">
        <canvas id="desk" width="720" height="460"></canvas>
        <button class="sub" id="goHome">定時で帰る</button>
      </div>
      <div class="desk-hud" id="deskHud"></div>
    </section>
  </div>

  <!-- 業務実績 -->
  <section class="sheet" id="statsSheet">
    <h2>業務実績報告書</h2>
    <div class="stats" id="stats"></div>
    <h3 id="achTitle" class="ach-title">実績</h3>
    <ul class="ach" id="achList"></ul>
    <details class="zukan">
      <summary id="zukanTitle">差し戻し理由図鑑</summary>
      <ol id="zukanList"></ol>
    </details>
    <div class="center"><button class="sub" id="resetBtn">人事異動（記録を消去）</button></div>
  </section>
</main>

<div id="toasts"></div>

<!-- FAXモーダル -->
<div class="modal hidden" id="faxModal">
  <div class="modal-box fax-box">
    <h3>FAX送信</h3>
    <div class="fax-machine">
      <div class="fax-lcd" id="faxStatus"></div>
      <canvas id="faxPaper" width="260" height="300"></canvas>
    </div>
  </div>
</div>

<!-- 押印モーダル -->
<div class="modal hidden" id="stampModal">
  <div class="modal-box">
    <h3>申請者押印</h3>
    <p id="stampHint"></p>
    <canvas id="stampPreview" width="220" height="220"></canvas>
    <div id="angleText">0.0°</div>
    <div class="ink"><div id="inkMeter"></div></div>
    <div class="btns">
      <button class="sub" id="inkBtn">朱肉をつける</button>
      <button id="pressBtn">押す</button>
    </div>
  </div>
</div>

function fmtDate(d) {
  const w = '日月火水木金土'[d.getDay()];
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}(${w})`;
}
function addBusinessDays(d, n) {
  const r = new Date(d);
  while (n > 0) {
    r.setDate(r.getDate() + 1);
    if (r.getDay() !== 0 && r.getDay() !== 6) n--;
  }
  return r;
}

/** 申請理由の添削（課長の趣味） */
function critiqueReason(text) {
  const t = text.trim();
  if (!t) return null;
  const rules = [
    [/至急|急ぎ|早急|ASAP/i, '「急ぎ」の案件ほど慎重に審議すべきである'],
    [/DX|AI|IT|デジタル|クラウド|アジャイル/i, '横文字・カタカナ語が含まれている。上の者が理解できない'],
    [/効率|削減|簡略|短縮|自動化/, '効率化すると我々の仕事が減るので不可'],
    [/お願い|ください/, '「お願い」ではなく「ご高配を賜りたく」が正しい'],
    [/なぜ|どうして(?!も)|\?|？/, '申請理由に疑問形を使うのは決裁者への挑戦と見なす'],
    [/ため$/, '「〜のため」で文を終えるのは体言止めの濫用'],
    [/私|僕|俺/, '一人称を用いるのは組織人としての自覚に欠ける'],
    [/!|！/, '感嘆符は感情的である'],
    [/[0-9０-９]/, '数字の根拠資料が添付されていない'],
  ];
  for (const [re, msg] of rules) if (re.test(t)) return `申請理由：${msg}`;
  if ([...t].length < 10) return `申請理由が${[...t].length}文字しかない。熱意が感じられない`;
  if ([...t].length > 80) return `申請理由が${[...t].length}文字もある。読む時間がない`;
  return null;
}

/**
 * 印影を描く。
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} name 氏名（縦書き）
 * @param {object} opt  angle: 傾き(deg), ink: 0..1 朱肉の濃さ, size
 */
function drawHanko(ctx, name, opt = {}) {
  const size = opt.size || ctx.canvas.width;
  const angle = (opt.angle || 0) * Math.PI / 180;
  const ink = opt.ink ?? 1;
  const off = document.createElement('canvas');
  off.width = off.height = size;
  const o = off.getContext('2d');
  const c = size / 2;
  const shape = opt.shape || 'mitome';
  const r = size * (shape === 'jitsuin' ? 0.46 : 0.4);

  o.translate(c, c);
  o.rotate(angle);
  o.strokeStyle = o.fillStyle = shape === 'shachi' ? '#e0301e' : '#c8261d';
  o.lineWidth = size * 0.045;
  o.beginPath();
  if (shape === 'kaku') {
    o.rect(-r, -r, r * 2, r * 2);
  } else if (shape === 'oval') {
    o.ellipse(0, 0, r * 0.62, r, 0, 0, Math.PI * 2);
  } else {
    o.arc(0, 0, r, 0, Math.PI * 2);
  }
  o.stroke();
  if (shape === 'jitsuin') {
    // 実印は二重枠で威圧感を出す
    o.lineWidth = size * 0.015;
    o.beginPath();
    o.arc(0, 0, r * 0.86, 0, Math.PI * 2);
    o.stroke();
  }

  // 縦書きの氏名
  const chars = [...name].slice(0, 4);
  const inner = shape === 'oval' ? r * 0.75 : r;
  const fs = Math.min(inner * 1.5 / chars.length, (shape === 'oval' ? r * 0.55 : r * 0.95));
  o.font = `bold ${fs}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  if (shape === 'kaku' || shape === 'jitsuin') {
    // 角印・実印は「之印」をつけて2列に
    const all = [...chars, '之', '印'];
    const col = Math.ceil(all.length / 2);
    const f2 = Math.min(r * 1.6 / col, r * 0.8);
    o.font = `bold ${f2}px "Yu Mincho","Hiragino Mincho ProN",serif`;
    all.forEach((ch, i) => {
      const x = i < col ? f2 * 0.5 : -f2 * 0.5; // 右の列から読む
      const k = i < col ? i : i - col;
      o.fillText(ch, x, -f2 * col / 2 + f2 * (k + 0.5));
    });
  } else {
    const total = fs * chars.length;
    chars.forEach((ch, i) => {
      o.fillText(ch, 0, -total / 2 + fs * (i + 0.5));
    });
  }

  o.setTransform(1, 0, 0, 1, 0, 0);
  if (shape === 'digital') {
    // デジタル印：わざと荒いピクセルにする
    const px = Math.max(3, Math.floor(size / 30));
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = Math.ceil(size / px);
    const t = tmp.getContext('2d');
    t.drawImage(off, 0, 0, tmp.width, tmp.height);
    o.clearRect(0, 0, size, size);
    o.imageSmoothingEnabled = false;
    o.drawImage(tmp, 0, 0, size, size);
    ctx.drawImage(off, 0, 0, ctx.canvas.width, ctx.canvas.height);
    return;
  }
  if (shape === 'shachi') {
    // シャチハタ：むらが一切ない、それが罪
    ctx.drawImage(off, 0, 0, ctx.canvas.width, ctx.canvas.height);
    return;
  }

  // 朱肉のかすれ：ランダムに点を抜く
  o.globalCompositeOperation = 'destination-out';
  const holes = Math.floor(size * size * 0.02 * (1.4 - ink));
  for (let i = 0; i < holes; i++) {
    o.globalAlpha = Math.random() * 0.8;
    const s = Math.random() * size * 0.025;
    o.fillRect(Math.random() * size, Math.random() * size, s, s);
  }
  o.globalAlpha = 1;
  o.globalCompositeOperation = 'source-over';

  ctx.globalAlpha = 0.55 + 0.45 * ink;
  ctx.drawImage(off, 0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.globalAlpha = 1;
}

/** 押印アニメーション：上から降ってきてドン */
function stampAnimated(canvas, name, opt) {
  return new Promise((resolve) => {
    const ctx = canvas.getContext('2d');
    // 非表示タブでは rAF が止まるので即押印（誰も見ていなくても稟議は進む）
    if (document.hidden) { drawHanko(ctx, name, opt); resolve(); return; }
    const start = performance.now();
    const dur = 260;
    const base = document.createElement('canvas');
    base.width = canvas.width; base.height = canvas.height;
    base.getContext('2d').drawImage(canvas, 0, 0);
    function frame(t) {
      const p = Math.min(1, (t - start) / dur);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(base, 0, 0);
      if (p < 1) {
        const s = 1 + (1 - p) * 1.8;
        ctx.save();
        ctx.globalAlpha = p * 0.6;
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(s, s);
        ctx.translate(-canvas.width/2, -canvas.height/2);
        drawHanko(ctx, name, { ...opt, ink: (opt.ink ?? 1) * p });
        ctx.restore();
        requestAnimationFrame(frame);
      } else {
        drawHanko(ctx, name, opt);
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

async function submit() {
  if (state.running) return;
  const kind = KINDS[$('kind').selectedIndex];
  const reason = $('reason').value.trim() || '（理由未記入）';
  const applicant = ($('applicant').value.trim() || '山田').slice(0, 4);

  state.running = true;
  state.current = { kind, reason, applicant, submitted: new Date(state.date) };
  stats.docs++;
  unlock('first');
  if (stats.docs >= 100) unlock('hundred');
  if (!$('reason').value.trim()) unlock('noReason');
  $('submitBtn').disabled = true;
  renderNemawashi();
  $('retryBtn').classList.add('hidden');
  $('retryBtn').textContent = '再申請する';
  $('banner').className = 'banner';
  $('flowSheet').classList.remove('hidden');
  $('log').innerHTML = '';
  $('docinfo').innerHTML = `
    <div>稟議番号</div><div>第${state.docNo}号</div>
    <div>件名</div><div>${escapeHtml(kind.label)}${kind.depth ? `<br><small>（${kind.depth}次事前申請）</small>` : ''}</div>
    <div>申請理由</div><div>${escapeHtml(reason)}</div>
    <div>起案日</div><div>${fmtDate(state.date)}</div>`;

  const cells = buildRoute(applicant);
  $('flowSheet').scrollIntoView({ behavior: 'smooth' });

  // 申請者の押印（手押し）
  const seal = SEALS[$('seal').selectedIndex];
  const my = await stampMinigame(applicant, seal);
  sfx.stamp();
  await stampAnimated(cells[0].querySelector('canvas'), applicant, { angle: my.angle, ink: my.ink, shape: seal.shape });
  cells[0].querySelector('.date').textContent = fmtDate(state.date).slice(5, 10);
  stats.stamps++;
  log(`${applicant}（申請者）が起案・押印しました。（傾き ${my.angle.toFixed(1)}° / 朱肉 ${(my.ink*100).toFixed(0)}%）`, 'sys');

  // 申請者の印影チェック（係長が最初に目を光らせる）
  const myProblem = judgeMyStamp(my);
  if (myProblem) {
    if (seal.id === 'shachi') unlock('shachi');
    else if (seal.id === 'digital') unlock('dx');
    else if (myProblem.includes('実印')) unlock('jitsuin');
    else if (my.ink < 0.35) unlock('usui');
    else if (my.ink > 1.2) unlock('nijimi');
    else if (my.angle > 0) unlock('hankou');
    else if (my.angle < -25) unlock('kuppuku');
    await sleep(500);
    advance(1);
    await reject(APPROVERS[0], myProblem);
    return;
  }

  for (let i = 0; i < APPROVERS.length; i++) {
    const ap = APPROVERS[i];
    const cell = cells[i + 1];
    cell.classList.add('active');
    if (ap.role === '社長') unlock('president');
    log(`${ap.role} ${ap.name} の決裁待ち…`, 'sys');
    say(cell, pick(THINKING));
    await sleep(900 + Math.random() * 900);

    // 営業日が過ぎていく
    advance(1 + Math.floor(Math.random() * 4));
    cell.classList.remove('active');

    // 前の決裁者が代理決裁だった場合
    if (state.current.proxy && Math.random() < 0.65) {
      const pr = state.current.proxy;
      say(cell, '代理？ 本人の確認は？');
      unlock('proxy');
      await reject(ap, `${pr.role}欄が代理決裁となっている。${pr.role}本人の事後承認が必要（本人は休暇明けで何も覚えていない）`);
      return;
    }
    state.current.proxy = null;

    if (isOverHead(i) && Math.random() < 0.8) {
      const boss = APPROVERS[Math.max(...state.nema.keys())];
      say(cell, `${boss.role}には話を通したんだって？`);
      unlock('atamagoshi');
      await reject(ap, `頭越しに${boss.role}へ根回しした。まず${ap.role}である私に話を通すのが筋`);
      return;
    }
    // 課長は申請理由を添削する
    if (ap.role === '課長' && Math.random() < 0.7) {
      const c = critiqueReason(state.current.reason === '（理由未記入）' ? '' : state.current.reason);
      if (c) {
        say(cell, '赤ペン入れといたから');
        unlock('akapen');
        await reject(ap, c);
        return;
      }
    }
    // 社長は社内六曜を気にする
    if (ap.role === '社長') {
      const rk = rokuyo(state.date);
      if (rk === '仏滅') {
        say(cell, '今日は仏滅だよ君');
        unlock('butsumetsu');
        await reject(ap, `本日は社内六曜で仏滅（${fmtDate(state.date)}）`);
        return;
      }
      if (rk === '友引' && Math.random() < 0.5) {
        say(cell, '友引だから他のも道連れね');
        stats.rejects += 2;
        await reject(ap, '本日は友引のため、無関係の稟議2件も道連れで差し戻した');
        return;
      }
    }
    const strict = ap.strict * (state.nema.get(i) ?? 1);
    if (Math.random() < strict) {
      // 事前申請の中では事前申請を要求されやすい（再帰）
      const depth = state.current.kind.depth || 0;
      const reason = Math.random() < 0.15 + depth * 0.1 ? PRE_REASON : pick(REJECT_REASONS);
      say(cell, reason.length > 22 ? '差し戻し。理由は書いておいた' : reason + '。差し戻し');
      await reject(ap, reason);
      if (reason === PRE_REASON) preparePreApplication();
      return;
    }
    // たまに休暇中で代理が押す
    if (i < APPROVERS.length - 1 && Math.random() < 0.1) {
      say(cell, `（${ap.name}は有給休暇中です）`);
      await sleep(700);
      sfx.stamp();
      await stampAnimated(cell.querySelector('canvas'), '代理', { angle: -10, ink: 0.7, shape: 'oval' });
      cell.querySelector('.date').textContent = fmtDate(state.date).slice(5, 10);
      log(`${ap.role} ${ap.name} は休暇中のため、隣の席の人が代理で押印しました。`, 'sys');
      stats.stamps++;
      state.current.proxy = ap;
      continue;
    }
    say(cell, pick(['よし', 'ポン', 'まあいいでしょう', '（無言で押印）', '異議なし', 'とりあえず押しとく']));
    // お辞儀：部下は上長側（左）に傾ける
    sfx.stamp();
    await stampAnimated(cell.querySelector('canvas'), ap.name, {
      angle: -8 - Math.random() * 10,
      ink: 0.6 + Math.random() * 0.4,
      shape: ap.shape,
    });
    cell.querySelector('.date').textContent = fmtDate(state.date).slice(5, 10);
    log(`${ap.role} ${ap.name} が押印しました。`, 'ok');
    stats.stamps++;
    stats.farthest = Math.max(stats.farthest, i + 1);
  }

  // 全員押印……しかし
  await sleep(600);
  log('全決裁者の押印が完了しました。', 'ok');
  await fate();
}

/** 押印欄に銅像を描く（ハンコの代わりに） */
function drawStatue(cv) {
  const g = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  g.clearRect(0, 0, w, h);
  const grd = g.createLinearGradient(0, 0, w, 0);
  grd.addColorStop(0, '#3d5a4a'); grd.addColorStop(0.5, '#6f8f7a'); grd.addColorStop(1, '#2f4538');
  g.fillStyle = grd;
  // 台座
  g.fillRect(w * 0.25, h * 0.78, w * 0.5, h * 0.16);
  // 胴体
  g.beginPath();
  g.moveTo(w * 0.3, h * 0.78);
  g.quadraticCurveTo(w * 0.28, h * 0.45, w * 0.5, h * 0.42);
  g.quadraticCurveTo(w * 0.72, h * 0.45, w * 0.7, h * 0.78);
  g.fill();
  // 頭
  g.beginPath();
  g.arc(w * 0.5, h * 0.3, w * 0.12, 0, Math.PI * 2);
  g.fill();
  // 腕組み
  g.strokeStyle = '#2a3d32'; g.lineWidth = w * 0.03;
  g.beginPath(); g.moveTo(w * 0.36, h * 0.58); g.lineTo(w * 0.64, h * 0.6); g.stroke();
  // 鳩のフン
  g.fillStyle = '#f4f4ee';
  g.beginPath(); g.arc(w * 0.46, h * 0.2, w * 0.025, 0, Math.PI * 2); g.fill();
}

/** FAX送信演出。'jam' | 'toner' | 'loop' のいずれかで終わる */
function faxSend() {
  return new Promise((resolve) => {
    const modal = $('faxModal');
    const cv = $('faxPaper');
    const g = cv.getContext('2d');
    const outcome = pick(['jam', 'toner', 'loop']);
    modal.classList.remove('hidden');
    $('faxStatus').textContent = 'ダイヤル中… 03-XXXX-XXXX';
    g.fillStyle = '#f7f5ee';
    g.fillRect(0, 0, cv.width, cv.height);
    sfx.fax();

    const lines = [
      '稟 議 書（承認済）', '',
      `第${state.docNo}号`,
      `件名：${state.current.kind.label}`.slice(0, 24),
      `申請者：${state.current.applicant}`,
      '', '上記の件、全決裁者の', '押印をもって承認する。', '',
      '（押印欄）', '◯ ◯ ◯ ◯ ◯ ◯ ◯ ◯',
    ];
    let y = 0;
    const stopAt = outcome === 'jam' ? cv.height * 0.45 : cv.height;
    let t0 = null;
    setTimeout(() => { $('faxStatus').textContent = 'ピーーーギャーーーーー（送信中）'; }, 900);

    function step(t) {
      if (t0 === null) t0 = t;
      if (t - t0 < 1500) return requestAnimationFrame(step);
      y += 1.6;
      // 感熱紙のノイズ
      if (outcome !== 'toner') {
        g.fillStyle = 'rgba(0,0,0,.05)';
        for (let i = 0; i < 6; i++) g.fillRect(Math.random() * cv.width, y, Math.random() * 3, 1);
        g.fillStyle = '#222';
        g.font = '15px "MS Gothic", monospace';
        const li = Math.floor((y - 20) / 22);
        if ((y - 20) % 22 < 1.6 && li >= 0 && li < lines.length) {
          g.fillText(lines[li], 16, y + 14);
        }
      }
      if (y < stopAt) {
        requestAnimationFrame(step);
      } else {
        if (outcome === 'jam') {
          // くしゃっ
          g.strokeStyle = '#999';
          for (let i = 0; i < 14; i++) {
            g.beginPath();
            g.moveTo(Math.random() * cv.width, y - Math.random() * 30);
            g.lineTo(Math.random() * cv.width, y + Math.random() * 10);
            g.stroke();
          }
          $('faxStatus').textContent = 'エラー E-03：紙詰まり';
        } else if (outcome === 'toner') {
          $('faxStatus').textContent = '送信完了（※トナー残量 0%）';
        } else {
          $('faxStatus').textContent = '送信完了';
        }
        setTimeout(() => { modal.classList.add('hidden'); resolve(outcome); }, 1600);
      }
    }
    if (document.hidden) { modal.classList.add('hidden'); return resolve(outcome); }
    requestAnimationFrame(step);
  });
}

async function reject(ap, reason) {
  log(`${ap.role} ${ap.name} により差し戻されました。理由：${reason}`, 'rej');
  collectReason(reason);
  sfx.reject();
  stats.rejects++;
  stats.streak++;
  stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  unlock('firstRej');
  if (stats.streak >= 5) unlock('streak5');
  if (stats.streak >= 20) unlock('streak20');
  const k = state.current.kind.label;
  if (k.includes('取り下げ')) unlock('torisage');
  if (k.includes('簡略化')) unlock('kaizen');
  showBanner('差戻');
  finish();
}

/** 差し戻し理由を図鑑に登録する（数値などは除去して同一視） */
function collectReason(reason) {
  const key = reason
    .replace(/（[^）]*[0-9][^）]*）/g, '')
    .replace(/[0-9０-９.\-]+(文字|°|%|件)?/g, '◯')
    .replace(/(係長|課長|次長|部長|本部長|常務|専務|社長)(欄|へ|である|本人)/g, '某$2');
  stats.reasons = stats.reasons || {};
  const isNew = !stats.reasons[key];
  stats.reasons[key] = (stats.reasons[key] || 0) + 1;
  if (isNew) {
    log(`📕 差し戻し理由図鑑に新しい理由が登録されました（${Object.keys(stats.reasons).length}種類目）`, 'sys');
  }
  const n = Object.keys(stats.reasons).length;
  if (n >= 10) unlock('zukan10');
  if (n >= 30) unlock('zukan30');
}

function renderZukan() {
  const r = stats.reasons || {};
  const entries = Object.entries(r).sort((a, b) => b[1] - a[1]);
  $('zukanTitle').textContent = `差し戻し理由図鑑（${entries.length}種類 収集）`;
  $('zukanList').innerHTML = entries.length
    ? entries.map(([k, v], i) => `<li><span class="no">No.${String(i + 1).padStart(3, '0')}</span>${escapeHtml(k)}<span class="cnt">×${v}</span></li>`).join('')
    : '<li>まだ差し戻されていません（時間の問題です）</li>';
}

/** 根回しUI */
function renderNemawashi() {
  $('nemaGrid').innerHTML = '';
  APPROVERS.forEach((ap, i) => {
    const done = state.nema.has(i);
    const b = document.createElement('button');
    b.className = 'nema-btn' + (done ? ' done' : '');
    b.innerHTML = `${ap.role}<br><small>${ap.name}${done ? ' ✔' : ''}</small>`;
    b.disabled = state.running;
    b.onclick = () => nemawashi(i);
    $('nemaGrid').appendChild(b);
  });
}

function nemawashi(i) {
  if (state.running) return;
  const ap = APPROVERS[i];
  // 偉い人ほど高くつく
  const pool = NEMAWASHI.slice(Math.min(i >> 1, 3), Math.min(NEMAWASHI.length, 3 + i));
  const n = pick(pool);
  const prev = state.nema.get(i) ?? 1;
  state.nema.set(i, prev * n.eff);
  stats.yen += n.yen;
  stats.nemaYen = (stats.nemaYen || 0) + n.yen;
  if (n.days) advance(n.days); else renderStats();
  const el = document.createElement('div');
  el.textContent = `[${fmtDate(state.date)}] ${ap.role} ${ap.name}：${n.act}（${n.yen.toLocaleString()}円）→ ${n.line}`;
  $('nemaLog').prepend(el);
  sfx.pat();
  if (state.nema.size === APPROVERS.length) unlock('nemaAll');
  if (n.act.includes('ゴルフ')) unlock('golf');
  renderNemawashi();
  save();
}

/** 頭越しチェック：自分より上の人だけ根回しされていたら怒る */
function isOverHead(i) {
  if (state.nema.has(i)) return false;
  for (const j of state.nema.keys()) if (j > i) return true;
  return false;
}

/** 事前申請を生成して申請種別に追加する */
function preparePreApplication() {
  const base = state.current.kind;
  const depth = (base.depth || 0) + 1;
  const root = base.root || base.label;
  const kind = { label: `「${base.label}」の事前申請`, cost: 0, depth, root };
  KINDS.push(kind);
  const o = document.createElement('option');
  o.textContent = depth >= 3 ? `「${root}」の${depth}次事前申請` : kind.label;
  $('kind').appendChild(o);
  $('kind').selectedIndex = KINDS.length - 1;
  $('retryBtn').textContent = `${depth}次事前申請を起案する`;
  log(`※ 「${depth}次事前申請」の様式が申請種別に追加されました。`, 'sys');
  stats.maxDepth = Math.max(stats.maxDepth || 0, depth);
  if (depth >= 3) unlock('matryoshka');
  if (depth >= 6) unlock('recursion');
}

/** 決裁者の吹き出し */
function say(cell, text) {
  const b = $('bubble');
  const sheet = $('flowSheet').getBoundingClientRect();
  const r = cell.getBoundingClientRect();
  b.textContent = text;
  b.className = 'bubble show';
  const w = Math.min(220, sheet.width - 20);
  b.style.maxWidth = w + 'px';
  let left = r.left - sheet.left + r.width / 2;
  left = Math.max(w / 2 + 10, Math.min(sheet.width - w / 2 - 10, left));
  b.style.left = left + 'px';
  b.style.top = (r.top - sheet.top - 8) + 'px';
  clearTimeout(say.t);
  say.t = setTimeout(() => b.classList.remove('show'), 1600);
}

function showBanner(text, color) {
  const b = $('banner');
  b.textContent = text;
  b.style.color = b.style.borderColor = color || '';
  b.className = 'banner';
  void b.offsetWidth;
  b.classList.add('show');
}

function finish() {
  state.running = false;
  // 根回しの効果は1回限り（みんな忘れる）
  if (state.nema.size) log('※ 根回しの効果は本件限りです。決裁者たちはもう忘れました。', 'sys');
  state.nema.clear();
  renderNemawashi();
  state.docNo++;
  updateClock();
  renderStats();
  save();
  $('submitBtn').disabled = false;
  $('retryBtn').classList.remove('hidden');
}

// ============================================================
// 申請者の手押しハンコ ミニゲーム
// ============================================================
/**
 * 振り子のように揺れるハンコを、良いお辞儀角度で押す。
 * 朱肉ボタンを押した回数で濃さが決まる。
 */
function stampMinigame(name, seal) {
  return new Promise((resolve) => {
    const modal = $('stampModal');
    const cv = $('stampPreview');
    const ctx = cv.getContext('2d');
    let ink = 0;
    let t0 = performance.now();
    let angle = 0;
    let raf;
    const speed = 1.6 + Math.random() * 1.6;
    modal.classList.remove('hidden');
    $('inkMeter').style.width = '0%';
    $('inkBtn').disabled = !!seal.noInk;
    if (seal.noInk) { ink = 1; $('inkMeter').style.width = '62%'; }
    $('stampHint').textContent = '朱肉をつけてから、上長に向かってお辞儀する角度（左に8〜25°）で押してください。';

    function loop(t) {
      angle = Math.sin((t - t0) / 1000 * speed) * 40;
      ctx.clearRect(0, 0, cv.width, cv.height);
      // ガイド扇形
      ctx.save();
      ctx.translate(cv.width / 2, cv.height / 2);
      ctx.fillStyle = 'rgba(60,110,58,.15)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, cv.width * 0.48, -Math.PI / 2 - 25 * Math.PI / 180, -Math.PI / 2 - 8 * Math.PI / 180);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      drawHanko(ctx, name, { angle, ink: seal.noInk ? 1 : Math.max(0.15, ink), shape: seal.shape });
      $('angleText').textContent = `${angle.toFixed(1)}°`;
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    $('inkBtn').onclick = () => {
      ink = Math.min(1.6, ink + 0.12 + Math.random() * 0.08);
      $('inkMeter').style.width = Math.min(100, ink / 1.6 * 100) + '%';
      $('inkMeter').style.background = ink > 1.2 ? '#7a0d08' : '#c8261d';
      sfx.pat();
    };
    $('pressBtn').onclick = () => {
      cancelAnimationFrame(raf);
      modal.classList.add('hidden');
      resolve({ angle, ink, seal });
    };
  });
}

  if (seal.id === 'digital') return 'デジタル印は不可。印刷して押印し、スキャンしてPDF化し、再度印刷して提出すること';
  if (seal.id === 'kaku') return '個人が角印を使うのは会社を私物化しているのと同義';
  if (seal.id === 'oval' && Math.random() < 0.7) return '銀行印の印影を社内に晒すのはセキュリティ上問題がある（印影はすでに全員に回覧済み）';
  if (seal.id === 'jitsuin' && Math.random() < 0.6) return 'この程度の稟議に実印とは何事か。重すぎて決裁者が萎縮する';
  if (ink < 0.35) return `申請者印が薄すぎて判読できない（朱肉 ${(ink*100).toFixed(0)}%）`;
  if (ink > 1.2) return `申請者印がにじんでおり、反社会的な印象を与える（朱肉 ${(ink*100).toFixed(0)}%）`;
  if (angle > 0) return `申請者印が上長に背を向けている（${angle.toFixed(1)}°）。反抗の意思ありと判断`;

  if (angle < -25) return `申請者印のお辞儀が深すぎて卑屈（${angle.toFixed(1)}°）`;
  return null;
}

// ============================================================
// 効果音（Web Audio API）
// ============================================================
const sfx = (() => {
  let ac = null;
  const ctx = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());
  function noise(dur, freq, gain) {
    const a = ctx();
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = a.createBufferSource();
    src.buffer = buf;
    const f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain(); g.gain.value = gain;
    src.connect(f).connect(g).connect(a.destination);
    src.start();
  }
  function tone(freq, dur, type = 'sine', gain = 0.2, slide = 0) {
    const a = ctx();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, a.currentTime + dur);
    g.gain.setValueAtTime(gain, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  return {
    stamp() { try { noise(0.18, 600, 0.9); tone(90, 0.15, 'sine', 0.5, 0.5); } catch (e) {} },
    pat()   { try { noise(0.06, 1500, 0.3); } catch (e) {} },
    reject(){ try { tone(220, 0.5, 'sawtooth', 0.12, 0.5); } catch (e) {} },
    sigh()  { try { noise(1.2, 400, 0.25); } catch (e) {} },
    fax() {
      try {
        const a = ctx();
        // ダイヤルトーン → ピー → ギャー
        const seq = [[1100, 0.9], [2100, 0.8], [1650, 0.15], [1850, 0.15], [1300, 0.2], [2400, 0.3]];
        let t = a.currentTime;
        seq.forEach(([f, d]) => {
          const o = a.createOscillator(), g = a.createGain();
          o.type = 'square'; o.frequency.value = f;
          g.gain.value = 0.04;
          o.connect(g).connect(a.destination);
          o.start(t); o.stop(t + d);
          t += d + 0.05;
        });
        setTimeout(() => noise(1.2, 3000, 0.15), 2000);
      } catch (e) {}
    },
  };
})();

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ============================================================
// 決裁者モード（Canvasゲーム）
// ============================================================
const Desk = (() => {
  const cv = $('desk');
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  let ME = '山田'; // 課長であるあなたの印鑑（申請者氏名を流用）
  const SUBJECTS = [
    'コピー用紙（A4・500枚）の購入', 'ホワイトボードマーカー（黒）の補充', '会議室Bの予約延長',
    '観葉植物への水やり当番の変更', '社内報の誤字（1文字）の訂正', '電球（トイレ）の交換',
    '新年会の店の選定方法を決める会議の開催', 'セロハンテープの台の購入', '名刺の追加印刷（50枚）',
    'エレベーターのボタンを押す係の設置', '稟議書の様式の改訂についての稟議', 'シュレッダーのゴミ捨て',
    '傘立ての増設', '部署の金魚の餌の購入', '「承認」ハンコのインク補充', '週報の週報の作成',
  ];
  const TRAPS = [
    '課長（あなた）の地方支社への異動', '課長（あなた）の役職手当の廃止', '課長席の撤去',
    '課長（あなた）の有給休暇の全消化の取り消し',
  ];
  const APPLICANTS = ['山田', '佐々木', '松本', '井上', '木村', '林', '清水', '森'];

  let running = false, raf = 0, last = 0;
  let pending, processed, mistakes, minutes, spawnTimer, doc, anim, msg, mouse, swingT, overtimeCount, stampsOnDoc;

  function reset() {
    pending = 12; processed = 0; mistakes = 0; minutes = 9 * 60; spawnTimer = 0;
    overtimeCount = 0; swingT = 0; msg = null; anim = null;
    mouse = { x: W / 2, y: H / 2, inside: false };
    nextDoc();
  }

  function nextDoc() {
    if (pending <= 0) { pending = 0; doc = null; return; }
    pending--;
    const trap = Math.random() < 0.08;
    doc = {
      subject: trap ? pick(TRAPS) : pick(SUBJECTS),
      applicant: pick(APPLICANTS),
      trap,
      no: Math.floor(Math.random() * 90000) + 10000,
      x: 0, // スライド用オフセット
    };
    stampsOnDoc = [];
    anim = { type: 'in', t: 0 };
  }

  // 書類のレイアウト
  const D = { x: 190, y: 30, w: 340, h: 400 };
  const BOX = 62;
  const roles = ['部長', '次長', '課長', '係長', '申請者'];
  function boxRect(i) { // 右から左へ（申請者が右端）
    const total = roles.length * BOX;
    const x0 = D.x + (D.w - total) / 2;
    return { x: x0 + i * BOX, y: D.y + 250, w: BOX, h: BOX + 16 };
  }
  const TARGET = 2; // 課長欄

  function drawDoc(ox) {
    g.save();
    g.translate(ox, 0);
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.fillRect(D.x + 6, D.y + 6, D.w, D.h);
    g.fillStyle = '#fbf7ec';
    g.fillRect(D.x, D.y, D.w, D.h);
    g.fillStyle = '#2b2620';
    g.textAlign = 'center';
    g.font = 'bold 24px "Yu Mincho","Hiragino Mincho ProN",serif';
    g.fillText('稟　議　書', D.x + D.w / 2, D.y + 44);
    g.fillRect(D.x + 40, D.y + 54, D.w - 80, 2);
    g.textAlign = 'left';
    g.font = '14px "Yu Mincho","Hiragino Mincho ProN",serif';
    g.fillText(`No. ${doc.no}`, D.x + 24, D.y + 84);
    g.fillText('件名：', D.x + 24, D.y + 116);
    wrapText(doc.subject, D.x + 70, D.y + 116, D.w - 94, 20);
    g.fillText(`申請者：${doc.applicant}`, D.x + 24, D.y + 190);
    g.fillText('上記につき、ご決裁をお願いいたします。', D.x + 24, D.y + 220);
    roles.forEach((r, i) => {
      const b = boxRect(i);
      g.strokeStyle = '#2b2620';
      g.lineWidth = 1;
      g.strokeRect(b.x, b.y, b.w, b.h);
      g.beginPath(); g.moveTo(b.x, b.y + 16); g.lineTo(b.x + b.w, b.y + 16); g.stroke();
      g.font = '11px "Yu Mincho",serif';
      g.textAlign = 'center';
      g.fillStyle = i === TARGET ? '#c8261d' : '#2b2620';
      g.fillText(r, b.x + b.w / 2, b.y + 12);
      if (i === TARGET && !anim) {
        g.fillStyle = 'rgba(226,176,7,' + (0.15 + 0.1 * Math.sin(performance.now() / 200)) + ')';
        g.fillRect(b.x + 1, b.y + 17, b.w - 2, b.h - 18);
      }
    });
    // 既に押されている申請者・係長の印
    [[4, doc.applicant, -12], [3, '佐藤', -15]].forEach(([i, nm, a]) => {
      const b = boxRect(i);
      stampAt(b.x + b.w / 2, b.y + 16 + BOX / 2, nm, a, 0.9);
    });
    stampsOnDoc.forEach(st => stampAt(st.x, st.y, ME, st.a, 1));
    g.restore();
  }

  const stampCache = new Map();
  function stampImg(name, angle, ink) {
    const key = name + Math.round(angle) + ink;
    if (!stampCache.has(key)) {
      const c = document.createElement('canvas');
      c.width = c.height = 96;
      drawHanko(c.getContext('2d'), name, { angle, ink });
      stampCache.set(key, c);
      if (stampCache.size > 400) stampCache.delete(stampCache.keys().next().value);
    }
    return stampCache.get(key);
  }
  function stampAt(x, y, name, angle, ink, alpha = 1) {
    const s = BOX - 10;
    g.globalAlpha = alpha;
    g.drawImage(stampImg(name, angle, ink), x - s / 2, y - s / 2, s, s);
    g.globalAlpha = 1;
  }

  function wrapText(text, x, y, maxW, lh) {
    let line = '';
    for (const ch of text) {
      if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, y); line = ch; y += lh; }
      else line += ch;
    }
    g.fillText(line, x, y);
  }

  function drawPile(x, y, n, label) {
    const shown = Math.min(n, 70);
    for (let i = 0; i < shown; i++) {
      g.fillStyle = i % 2 ? '#f3eedf' : '#e9e2cf';
      const jitter = Math.sin(i * 12.9898) * 4;
      g.fillRect(x + jitter, y - i * 4, 130, 6);
    }
    g.fillStyle = '#fff';
    g.font = 'bold 14px sans-serif';
    g.textAlign = 'center';
    g.fillText(label, x + 65, y + 28);
    g.font = 'bold 22px monospace';
    g.fillText(`${n}`, x + 65, y + 52);
    // 溢れた書類が机に散らかる
    if (n > 70) {
      for (let i = 0; i < Math.min(n - 70, 120); i++) {
        const rx = (Math.sin(i * 78.233) * 0.5 + 0.5) * (W - 60);
        const ry = (Math.sin(i * 39.425) * 0.5 + 0.5) * (H - 40);
        g.save();
        g.translate(rx + 30, ry + 20);
        g.rotate(Math.sin(i * 3.1) * 1.2);
        g.fillStyle = 'rgba(245,240,226,.9)';
        g.fillRect(-28, -18, 56, 36);
        g.restore();
      }
    }
  }

  function fmtTime(m) {
    return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
  }

  function render() {
    // 机
    const grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#7a5c3e'); grd.addColorStop(1, '#5b4632');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(0,0,0,.06)';
    for (let i = 0; i < 12; i++) g.fillRect(0, i * 40 + 10, W, 2);

    drawPile(30, 400, pending, '未決');
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(560, 405, 130, 8);
    drawPile(560, 400, Math.min(processed, 70), '既決');
    g.fillStyle = '#fff'; g.font = 'bold 22px monospace'; g.textAlign = 'center';

    if (doc) {
      let ox = 0;
      if (anim) {
        const p = Math.max(0, Math.min(1, anim.t / 300));
        if (anim.type === 'in') ox = (1 - p) * -400;
        if (anim.type === 'ok') ox = p * 500;
        if (anim.type === 'back') ox = p * -500;
      }
      drawDoc(ox);
    } else {
      g.fillStyle = '#fff';
      g.font = 'bold 22px "Yu Mincho",serif';
      g.textAlign = 'center';
      g.fillText('未決書類がありません（今だけ）', W / 2, H / 2);
    }

    // 時計
    g.fillStyle = '#1f2a44';
    g.fillRect(W / 2 - 60, 2, 120, 26);
    g.fillStyle = minutes >= 17 * 60 ? '#ff6b5b' : '#e8f0ff';
    g.font = 'bold 18px monospace';
    g.textAlign = 'center';
    g.fillText(fmtTime(minutes), W / 2, 21);

    // メッセージ
    if (msg) {
      g.globalAlpha = Math.min(1, msg.life / 400);
      g.fillStyle = msg.color;
      g.font = 'bold 22px "Yu Mincho",serif';
      g.textAlign = 'center';
      g.strokeStyle = '#fff'; g.lineWidth = 4;
      g.strokeText(msg.text, W / 2, H - 24);
      g.fillText(msg.text, W / 2, H - 24);
      g.globalAlpha = 1;
    }

    // ハンコカーソル（振り子）
    if (mouse.inside) {
      const a = currentAngle();
      stampAt(mouse.x, mouse.y, ME, a, 1, 0.55);
      const okA = a <= -8 && a >= -25;
      g.font = 'bold 13px monospace';
      g.textAlign = 'left';
      g.fillStyle = okA ? '#3c6e3a' : '#c8261d';
      g.fillText(`${a.toFixed(0)}°`, mouse.x + 30, mouse.y - 22);
      g.strokeStyle = 'rgba(0,0,0,.3)';
      g.beginPath(); g.arc(mouse.x, mouse.y, 2, 0, Math.PI * 2); g.stroke();
    }
  }

  function currentAngle() {
    return Math.sin(swingT / 1000 * (1.8 + processed * 0.03)) * 35;
  }

  function say(text, color = '#c8261d') { msg = { text, color, life: 1600 }; }

  function update(dt) {
    swingT += dt;
    minutes += dt / 1000 * 2; // 1秒 = 2分
    spawnTimer += dt;
    const interval = Math.max(500, 2200 - processed * 15);
    while (spawnTimer > interval) { spawnTimer -= interval; pending++; }
    if (!doc && pending > 0 && !anim) nextDoc();
    if (anim) {
      anim.t += dt;
      if (anim.t >= 300) {
        const t = anim.type;
        anim = null;
        if (t === 'ok' || t === 'back') nextDoc();
      }
    }
    if (msg) { msg.life -= dt; if (msg.life <= 0) msg = null; }

    // 定時は概念
    if (minutes >= 17 * 60 + 30) {
      overtimeCount++;
      minutes = 17 * 60;
      pending += 30;
      say('部長「悪いけど、これも今日中にね」（+30件）', '#1f2a44');
      unlock('teijiConcept');
    }
    if (pending >= 100) unlock('pile100');
    hud();
  }

  function hud() {
    $('deskHud').innerHTML = `<span>処理済 ${processed}件</span><span>未決 ${pending}件</span><span>ミス ${mistakes}回</span><span>「今日中に」 ${overtimeCount}回</span>`;
  }

  function stamp(x, y) {
    if (!doc || anim) return;
    const a = currentAngle();
    const b = boxRect(TARGET);
    const cx = b.x + b.w / 2, cy = b.y + 16 + BOX / 2;
    const inBox = Math.abs(x - cx) < b.w / 2 - 6 && Math.abs(y - cy) < BOX / 2 - 4;
    stampsOnDoc.push({ x, y, a });
    sfx.stamp();
    if (doc.trap) {
      unlock('sasen');
      say('自分の左遷を自分で承認しました。おめでとうございます', '#1f2a44');
      mistakes++;
      anim = { type: 'ok', t: -400 };
      processed++;
      stats.deskDocs = (stats.deskDocs || 0) + 1;
      return;
    }
    if (!inBox) {
      mistakes++;
      pending++;
      say('枠外に押印！ 書類は再作成されます（+1件）');
      anim = { type: 'back', t: -300 };
      return;
    }
    if (a > -8 || a < -25) {
      mistakes++;
      pending++;
      say(a > -8 ? `お辞儀が足りない（${a.toFixed(0)}°）部長に睨まれた（+1件）` : `お辞儀しすぎ（${a.toFixed(0)}°）係長が恐縮した（+1件）`);
      anim = { type: 'back', t: -300 };
      return;
    }
    processed++;
    minutes += 6;
    stats.stamps++;
    stats.deskDocs = (stats.deskDocs || 0) + 1;
    say(pick(['ヨシ！', '承認（課長決裁のみ）', '次長に回しました', 'ポン']), '#3c6e3a');
    anim = { type: 'ok', t: -200 };
    if (processed >= 50) unlock('desk50');
    renderStats();
  }

  function sendBack() {
    if (!doc || anim) return;
    if (doc.trap) {
      say('危ないところでした。異動は回避（一時的に）', '#3c6e3a');
      unlock('dodge');
      anim = { type: 'back', t: 0 };
      return;
    }
    // 差し戻すと、いずれ再提出されて戻ってくる
    say('差し戻しました（そのうち戻ってきます）', '#555');
    setTimeout(() => { if (running) pending += 1; }, 3000);
    anim = { type: 'back', t: 0 };
  }

  function loop(t) {
    const dt = Math.min(100, t - last);
    last = t;
    update(dt);
    render();
    raf = requestAnimationFrame(loop);
  }

  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  let pressTimer = null;
  cv.addEventListener('pointermove', e => { Object.assign(mouse, toCanvas(e), { inside: true }); });
  cv.addEventListener('pointerleave', () => { mouse.inside = false; });
  cv.addEventListener('pointerdown', e => {
    if (e.button === 2) return;
    Object.assign(mouse, toCanvas(e), { inside: true });
    if (e.pointerType === 'touch') {
      // 長押しで差し戻し
      pressTimer = setTimeout(() => { pressTimer = null; sendBack(); }, 550);
    } else {
      stamp(mouse.x, mouse.y);
    }
  });
  cv.addEventListener('pointerup', e => {
    if (e.pointerType === 'touch' && pressTimer) {
      clearTimeout(pressTimer); pressTimer = null;
      stamp(mouse.x, mouse.y);
    }
  });
  cv.addEventListener('contextmenu', e => { e.preventDefault(); sendBack(); });

  // 定時で帰るボタンは逃げる
  const home = $('goHome');
  function flee() {
    const wrap = $('deskWrap').getBoundingClientRect();
    const bw = home.offsetWidth, bh = home.offsetHeight;
    home.style.right = 'auto';
    home.style.left = Math.random() * (wrap.width - bw) + 'px';
    home.style.top = Math.random() * (wrap.height - bh) + 'px';
    home.dataset.fled = (+home.dataset.fled || 0) + 1;
    if (+home.dataset.fled >= 10) unlock('teijiChase');
  }
  home.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(); });
  home.addEventListener('click', () => {
    unlock('teiji');
    say('帰ろうとしたら部長と目が合いました（+10件）', '#1f2a44');
    pending += 10;
    flee();
  });

  return {
    start() {
      if (running) return;
      ME = ($('applicant').value.trim() || '山田').slice(0, 4);
      if (!doc && pending === undefined) reset();
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(loop);
    },
    stop() {
      running = false;
      cancelAnimationFrame(raf);
      renderStats();
      save();
    },
  };
})();

    b.dataset.armed = '1';
    b.textContent = '本当に？（もう一度押す）';
    setTimeout(() => { delete b.dataset.armed; b.textContent = '人事異動（記録を消去）'; }, 3000);
    return;
  }
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
